# nginx vhost para panel.enrola.shop
#
# Asume que el container `panel` corre en el mismo docker network que medusa
# y storefront, escuchando en :3001.
#
# Pasos para activar:
#   1. Copiar a /etc/nginx/sites-available/panel.enrola.shop en el VPS
#   2. ln -s ../sites-available/panel.enrola.shop /etc/nginx/sites-enabled/
#   3. certbot --nginx -d panel.enrola.shop
#   4. nginx -t && systemctl reload nginx
#
# DNS necesita un A record `panel` → IP del VPS apuntando antes de certbot.

server {
    listen 80;
    listen [::]:80;
    server_name panel.enrola.shop;

    # certbot lo reescribe a 443 + cert. Antes de certbot, vive solo en 80.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket / SSE upgrade (Next.js dev usa hot reload por aquí)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers reales hacia Next
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts razonables para admin (puede tener queries pesadas)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings para evitar truncar respuestas grandes
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Hardening: bloquear bots scanners obvios
    location ~* /(\.git|\.env|wp-admin|phpmy) {
        return 444;
    }

    # Logs separados para el panel — facilita troubleshooting de auth
    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log warn;
}

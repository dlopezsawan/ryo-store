# RYO Store - desplegar como nuevo proyecto en el mismo VPS que n8n
# Se conecta a la red de n8n para usar Traefik
# Desplegar con: Hostinger MCP -> VPS_createNewProjectV1 (content = URL de este repo o YAML)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_secret}
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # postgres + redis live on the project-scoped `ryo_internal` network
    # only — they're never reached by Traefik or by other tenants on the
    # shared `n8n_default` network. This shrinks the blast radius if a
    # neighbouring stack on the same VPS gets compromised.
    networks:
      - ryo_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ryo_internal

  medusa:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD:-medusa_secret}@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
      STORE_CORS: https://enrola.shop,https://www.enrola.shop
      ADMIN_CORS: https://enrola.shop,https://api.enrola.shop
      AUTH_CORS: https://enrola.shop,https://api.enrola.shop,https://admin.enrola.shop
      BACKEND_PUBLIC_URL: https://api.enrola.shop
      LISTMONK_URL: http://listmonk:9000
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-RyoListmonk2024!}
      LISTMONK_LIST_ID: ${LISTMONK_LIST_ID:-3}
      GOOGLE_BRIDGE_SECRET: ${GOOGLE_BRIDGE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@enrola.shop}
      # Webmail IMAP/SMTP passwords — one per mailbox. Read from VPS .env;
      # accessed by /admin/webmail/accounts to determine which mailboxes
      # the operator can open. If the variable is missing or empty, the
      # backend marks `available: false` and the panel renders "Sin
      # password configurada".
      #
      # Empty default ":-" so the container starts even if the user's
      # .env hasn't set them yet (the panel will show the warning state
      # rather than crash).
      WEBMAIL_PASS_HOLA_ENROLA_SHOP: ${WEBMAIL_PASS_HOLA_ENROLA_SHOP:-}
      WEBMAIL_PASS_DANIEL_ENROLA_SHOP: ${WEBMAIL_PASS_DANIEL_ENROLA_SHOP:-}
      WEBMAIL_PASS_LEO_ENROLA_SHOP: ${WEBMAIL_PASS_LEO_ENROLA_SHOP:-}
      WEBMAIL_PASS_ADMIN_ENROLA_SHOP: ${WEBMAIL_PASS_ADMIN_ENROLA_SHOP:-}
      WEBMAIL_PASS_PEDIDOS_ENROLA_SHOP: ${WEBMAIL_PASS_PEDIDOS_ENROLA_SHOP:-}
      # Optional: override the default admin-email → mailboxes mapping
      # via JSON. Empty default; backend falls back to DEFAULT_ACCESS_MAP
      # when not set. See /admin/webmail/accounts/route.ts for the shape.
      WEBMAIL_ACCOUNT_ACCESS: ${WEBMAIL_ACCOUNT_ACCESS:-}
      # IMAP/SMTP host the backend connects to. Defaults already match the
      # mailserver container hostname on the docker network, so these are
      # only needed if the operator wants to point at an external mail
      # provider (Mailgun, Resend SMTP, etc.). Names match what
      # mail-service.ts actually reads (MAIL_*, not WEBMAIL_*).
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-mailserver}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-143}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailserver}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      # PostHog admin (server-side queries) — Personal API Key with
      # read scope. Without these, /admin/dev/posthog/* endpoints
      # respond `configured: false` and the panel renders the
      # "POSTHOG NO CONFIGURADO" banner. Empty defaults so the
      # container starts even if .env hasn't set them.
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      # Replai (pasarela de WhatsApp para Dana). El webhook /webhooks/replai
      # verifica la firma con REPLAI_WEBHOOK_SECRET; las respuestas salen por
      # {REPLAI_API_BASE}/v1/messages con REPLAI_API_KEY (sessionId=REPLAI_SESSION_ID).
      # Replai está self-hosted en este mismo VPS.
      REPLAI_API_BASE: ${REPLAI_API_BASE:-https://srv977695.hstgr.cloud/api}
      REPLAI_SESSION_ID: ${REPLAI_SESSION_ID:-}
      REPLAI_API_KEY: ${REPLAI_API_KEY:-}
      REPLAI_WEBHOOK_SECRET: ${REPLAI_WEBHOOK_SECRET:-}
    volumes:
      - medusa_uploads:/app/static
    labels:
      - traefik.enable=true
      - traefik.http.routers.medusa.rule=Host(`api.enrola.shop`)
      - traefik.http.routers.medusa.tls=true
      - traefik.http.routers.medusa.entrypoints=websecure
      - traefik.http.routers.medusa.tls.certresolver=mytlschallenge
      - traefik.http.services.medusa.loadbalancer.server.port=9000
      # Tell Traefik which network to use to reach this container.
      # Containers attached to multiple networks (here we're on
      # `ryo_internal` for backend comms + `n8n_default` for Traefik)
      # would otherwise have Traefik pick whichever network IP came
      # back first from the Docker daemon — sometimes ryo_internal,
      # which Traefik can't reach because traefik only lives on
      # n8n_default. Pinning the label makes it deterministic.
      - traefik.docker.network=n8n_default
      # NOTE: previously two extra Traefik routers exposed the Medusa admin
      # SPA + admin API on the public storefront domain
      # (`enrola.shop/dashboard` and `enrola.shop/admin/*`). Removed because:
      # - Surfacing admin assets on the customer-facing domain is a
      #   needless attack surface (login page, JS bundle, version disclosure)
      # - The admin already lives at `api.enrola.shop` (the canonical host
      #   for everything operator-facing) — this duplicate exposure was
      #   never the source of truth, only a leftover convenience
      # - SEO leak: the bundle name + assets were crawlable
      # If the admin needs a non-api.* shortcut in the future, expose it on
      # a dedicated subdomain (e.g. `admin.enrola.shop`) — never on the
      # public storefront host.
      # (medusa-auth router also removed for the same reasons — its only
      # purpose was supporting login flow for the admin SPA exposed at
      # enrola.shop/dashboard. The storefront's own auth lives under
      # /api/auth/* via NextAuth and is unaffected.)
    networks:
      # `ryo_internal` carries inter-service traffic (postgres, redis,
      # panel→medusa, storefront→medusa). `n8n_default` is required so
      # the n8n-traefik-1 reverse proxy can reach this container for
      # the api.enrola.shop route, and for medusa→listmonk.
      - ryo_internal
      - n8n_default

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MEDUSA_BACKEND_URL=https://api.enrola.shop
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        - RESEND_API_KEY=${RESEND_API_KEY:-build_placeholder}
        - NEXT_PUBLIC_GOOGLE_ENABLED=${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
        # PostHog: las vars NEXT_PUBLIC_* se inlinean en BUILD. Sin esto el
        # snippet nunca se inyecta y los 21 eventos hacen no-op (analytics
        # apagado en prod). Setear NEXT_PUBLIC_POSTHOG_KEY en el .env del VPS.
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        # Pin del local (delivery por km). Opcional: si no se setea usa el default de lib/delivery.
        - NEXT_PUBLIC_STORE_LAT=${NEXT_PUBLIC_STORE_LAT:-}
        - NEXT_PUBLIC_STORE_LNG=${NEXT_PUBLIC_STORE_LNG:-}
        - NEXT_PUBLIC_FREE_SHIPPING_EUR=${NEXT_PUBLIC_FREE_SHIPPING_EUR:-10}
    restart: unless-stopped
    depends_on:
      - medusa
    environment:
      # Use the explicit container name instead of the `medusa` alias.
      # The shared `n8n_default` network hosts other projects (e.g.
      # palosanto-store) whose own medusa container also registers as
      # `medusa` — Docker DNS then round-robins between them, so ~50%
      # of requests landed on a stranger DB and returned 401. Pinning
      # to the container name makes DNS deterministic. See PR fixing
      # the panel "Sesión expirada / credenciales incorrectas" loop.
      MEDUSA_BACKEND_URL: http://ryo-store-medusa-1:9000
      # Kill switch (2026-07-31): the whole storefront answers 404 while this
      # is "1" — enrola.shop is intentionally OFF the air. api.enrola.shop,
      # the panel and Dana are NOT affected. To bring the store back: set to
      # "0" (or remove) and `docker compose up -d storefront` — no rebuild.
      STOREFRONT_KILL_SWITCH: "1"
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://api.enrola.shop
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_STORE_NAME: RYO Store
      NEXT_PUBLIC_STORE_URL: https://enrola.shop
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_PRICE_DIVISOR: ${NEXT_PUBLIC_PRICE_DIVISOR:-1}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@enrola.shop}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      BCV_EUR_RATE: ${BCV_EUR_RATE:-510.49}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Verificación de cédula (MRW). Credenciales solo desde el .env del VPS —
      # ya no hardcodeadas en el código. Si faltan, el route degrada a
      # service_unavailable (no crashea).
      CEDULA_API_APP_ID: ${CEDULA_API_APP_ID}
      CEDULA_API_TOKEN: ${CEDULA_API_TOKEN}
      STOREFRONT_INTERNAL_SECRET: ${STOREFRONT_INTERNAL_SECRET}
      PEDIDOS_EMAIL: ${PEDIDOS_EMAIL:-pedidos@enrola.shop}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LISTMONK_URL: http://listmonk:9000
      LISTMONK_ADMIN_USER: admin
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-RyoListmonk2024!}
      LISTMONK_LIST_ID: ${LISTMONK_LIST_ID:-3}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://enrola.shop
      NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_BRIDGE_SECRET: ${GOOGLE_BRIDGE_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.routers.storefront.rule=Host(`enrola.shop`) || Host(`www.enrola.shop`)
      - traefik.http.routers.storefront.tls=true
      - traefik.http.routers.storefront.entrypoints=websecure
      - traefik.http.routers.storefront.tls.certresolver=mytlschallenge
      - traefik.http.services.storefront.loadbalancer.server.port=3000
      # Pin the Traefik backend network — see medusa block above.
      - traefik.docker.network=n8n_default
    volumes:
      - payment_proofs:/app/public/uploads
    networks:
      # `ryo_internal` for the storefront→medusa hop; `n8n_default` so
      # Traefik can route enrola.shop to this container.
      - ryo_internal
      - n8n_default

  # Operator panel (panel.enrola.shop) — custom Next.js admin used by the
  # warehouse + customer-service team (separate from the Medusa admin).
  # Speaks to medusa over the docker network on port 9000. Uses the
  # explicit container name (ryo-store-medusa-1) instead of the `medusa`
  # alias because the shared `n8n_default` network hosts other projects
  # whose containers also register as `medusa` — Docker DNS would then
  # round-robin between them and the panel hit a stranger DB ~50% of
  # the time, surfacing as random 401s ("Sesión expirada", "credenciales
  # incorrectas"). Pinning to the container name makes DNS deterministic.
  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: ryo-store-panel
    restart: unless-stopped
    environment:
      MEDUSA_ADMIN_URL: http://ryo-store-medusa-1:9000
      # Cookie session — generated with `openssl rand -base64 48`,
      # stored in /root/ryo-store/.env on the VPS. Distinct from Medusa's
      # JWT_SECRET so the two can rotate independently.
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET}
      PANEL_COOKIE_DOMAIN: panel.enrola.shop
      PANEL_COOKIE_SECURE: "true"
      # Resend — needed by /webmail and the "Email cliente" button on
      # order detail. Optional; the panel works without it (those screens
      # show "no configurado").
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-Enrola <hola@enrola.shop>}
      # DeepSeek — usado por /social/ai-copy (generador de copy). Valor en el
      # .env del VPS. (Dana usa su propia key guardada en la DB, aparte.)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      - medusa
    networks:
      # `ryo_internal` for the panel→medusa hop; `n8n_default` so Traefik
      # can route panel.enrola.shop to this container.
      - ryo_internal
      - n8n_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.panel.rule=Host(`panel.enrola.shop`)
      - traefik.http.routers.panel.tls=true
      - traefik.http.routers.panel.entrypoints=websecure
      - traefik.http.routers.panel.tls.certresolver=mytlschallenge
      - traefik.http.services.panel.loadbalancer.server.port=3001
      # Pin the Traefik backend network — see medusa block above.
      - traefik.docker.network=n8n_default

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    command: ["/bin/sh", "-c", "./listmonk --install --yes && ./listmonk"]
    depends_on:
      - postgres
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_app__admin_username: "admin"
      LISTMONK_app__admin_password: "${LISTMONK_ADMIN_PASSWORD:-RyoListmonk2024!}"
      LISTMONK_db__host: "postgres"
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: "medusa"
      LISTMONK_db__password: "${POSTGRES_PASSWORD:-medusa_secret}"
      LISTMONK_db__database: "listmonk"
      LISTMONK_db__ssl_mode: "disable"
    volumes:
      - ./listmonk-static/logo.svg:/listmonk/static/logo.svg:ro
      - ./listmonk-static/favicon.png:/listmonk/static/favicon.png:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.listmonk.rule=Host(`newsletter.enrola.shop`)
      - traefik.http.routers.listmonk.tls=true
      - traefik.http.routers.listmonk.entrypoints=websecure
      - traefik.http.routers.listmonk.tls.certresolver=mytlschallenge
      - traefik.http.services.listmonk.loadbalancer.server.port=9000
      # Pin the Traefik backend network — see medusa block above.
      - traefik.docker.network=n8n_default
    networks:
      # `ryo_internal` so it can reach postgres (its DB lives there);
      # `n8n_default` so Traefik can serve newsletter.enrola.shop.
      - ryo_internal
      - n8n_default

volumes:
  postgres_data:
  payment_proofs:
  medusa_uploads:

networks:
  # Project-scoped network for inter-service traffic. Postgres + Redis
  # live ONLY here so they can't be reached by other tenants on the
  # shared `n8n_default` network. App containers (medusa, panel,
  # storefront, listmonk) attach to both: `ryo_internal` for backend
  # comms, `n8n_default` for Traefik to reach them with the public TLS
  # routes. Auto-managed by compose (not external) — created on first
  # `docker compose up`, deleted only with `docker compose down`.
  ryo_internal:
    name: ryo_internal
  n8n_default:
    external: true

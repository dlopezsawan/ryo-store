<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1A1A1A;color:#F5F0E8;font-family:'Kanit',sans-serif;padding:20px}
h1{text-align:center;font-size:2rem;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;color:#E84B2B}
.sub{text-align:center;font-size:.85rem;color:#F5F0E8aa;margin-bottom:20px}
.filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button{background:#2a2a2a;color:#F5F0E8;border:2px solid #333;padding:4px 12px;font-family:'Kanit',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;cursor:pointer;transition:.2s}
.filters button:hover,.filters button.active{background:#E84B2B;border-color:#E84B2B;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:1400px;margin:0 auto}
.card{background:#2a2a2a;border:2px solid #333;padding:8px;text-align:center;transition:.2s;cursor:pointer;position:relative}
.card:hover{border-color:#E84B2B;transform:translateY(-2px);box-shadow:0 4px 12px #E84B2B33}
.card img{width:80px;height:80px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.card .num{font-size:.6rem;color:#F5F0E888}
.card .name{font-size:.7rem;font-weight:700;text-transform:uppercase;line-height:1.1}
.card .type{font-size:.55rem;color:#E84B2B;text-transform:uppercase;margin-top:2px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;z-index:999;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-content{background:#2a2a2a;border:3px solid #E84B2B;padding:20px;text-align:center;max-width:350px;width:90%}
.modal-content img{width:160px;height:160px;image-rendering:pixelated;margin-bottom:10px}
.modal-content .mnum{font-size:.8rem;color:#F5F0E888}
.modal-content .mname{font-size:1.4rem;font-weight:900;text-transform:uppercase}
.modal-content .mtype{font-size:.8rem;color:#E84B2B;text-transform:uppercase;margin-top:4px}
.modal-content .close{position:absolute;top:10px;right:15px;color:#F5F0E8;font-size:1.5rem;cursor:pointer}
.stats{text-align:center;margin-top:20px;font-size:.75rem;color:#F5F0E866}
</style>
</head>
<body>

<p class="sub">150 criaturas — Enrola Legends</p>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="this.classList.remove('open')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="close" onclick="document.getElementById('modal').classList.remove('open')">✕</span>
    <img id="m-img"><div id="m-num" class="mnum"></div><div id="m-name" class="mname"></div><div id="m-type" class="mtype"></div>
  </div>
</div>

const grid=document.getElementById('grid');
const stats=document.getElementById('stats');
function render(list){
  grid.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<img src="${c.file}" alt="${c.name}" loading="lazy"><div class="num">#${c.n}</div><div class="name">${c.name}</div>`;
    d.onclick=()=>{
      document.getElementById('m-img').src=c.file;
      document.getElementById('m-num').textContent='#'+c.n;
      document.getElementById('m-name').textContent=c.name;
      document.getElementById('modal').classList.add('open');
    };
    grid.appendChild(d);
  });
  stats.textContent=list.length+' / 150 criaturas';
}

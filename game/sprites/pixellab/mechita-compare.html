<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mechita Compare</title>
<style>
*{margin:0;box-sizing:border-box}body{background:#1A1A1A;color:#F5F0E8;font-family:monospace;padding:20px;text-align:center}
h2{color:#E84B2B;margin:15px 0 10px}
.row{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
img{image-rendering:pixelated;width:96px;height:96px;background:#2a2a2a;border:1px solid #444;padding:2px}
.label{font-size:11px;color:#888}
</style></head><body>
<h2>QUADRUPED (cat template, 1 gen)</h2>
<div class="row">
<div><img src="mechita-quad-south.png"><div class="label">south (front)</div></div>
<div><img src="mechita-quad-east.png"><div class="label">east</div></div>
<div><img src="mechita-quad-north.png"><div class="label">north (back)</div></div>
<div><img src="mechita-quad-west.png"><div class="label">west</div></div>
</div>
<h2>PRO MODE (AI reference, 20 gen, 8 dirs)</h2>
<div class="row">
<div><img src="mechita-pro-south.png"><div class="label">south</div></div>
<div><img src="mechita-pro-south-east.png"><div class="label">SE</div></div>
<div><img src="mechita-pro-east.png"><div class="label">east</div></div>
<div><img src="mechita-pro-north-east.png"><div class="label">NE</div></div>
<div><img src="mechita-pro-north.png"><div class="label">north</div></div>
<div><img src="mechita-pro-north-west.png"><div class="label">NW</div></div>
<div><img src="mechita-pro-west.png"><div class="label">west</div></div>
<div><img src="mechita-pro-south-west.png"><div class="label">SW</div></div>
</div>
</body></html>

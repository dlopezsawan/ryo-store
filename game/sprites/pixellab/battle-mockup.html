<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Battle Mockup — Peñalver Final</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap');
*{margin:0;box-sizing:border-box}
body{background:#1A1A1A;display:flex;flex-direction:column;align-items:center;padding:30px;font-family:'Kanit',sans-serif;color:#F5F0E8}
h1{color:#E84B2B;font-size:1.2rem;margin-bottom:15px}
.battle{position:relative;width:720px;height:420px;background:#000;overflow:hidden;border:2px solid #333}
.bg{width:100%;height:100%;object-fit:cover;object-position:center 40%;image-rendering:pixelated;position:absolute;top:0;left:0}

.unit{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:5}
.unit img{image-rendering:pixelated}
.oval{border-radius:50%;flex-shrink:0}

/* Player */
.player-unit{bottom:85px;left:60px}
.player-unit .sprite{width:100px;height:153px;filter:drop-shadow(0 0 8px rgba(255,200,100,0.35))}
.player-unit .oval{width:150px;height:36px;background:radial-gradient(ellipse,rgba(80,160,60,0.8) 0%,rgba(60,130,45,0.5) 50%,rgba(40,100,30,0.2) 75%,transparent 100%);margin-top:-18px}

/* Enemy */
.enemy-unit{top:135px;right:110px}
.enemy-unit .sprite{width:75px;height:95px;filter:drop-shadow(0 0 6px rgba(255,200,100,0.35))}
.enemy-unit .oval{width:110px;height:28px;background:radial-gradient(ellipse,rgba(80,160,60,0.8) 0%,rgba(60,130,45,0.5) 50%,rgba(40,100,30,0.2) 75%,transparent 100%);margin-top:-14px}

.hud{position:absolute;background:rgba(10,10,10,0.75);border:2px solid #E84B2B;border-radius:8px;padding:5px 10px;backdrop-filter:blur(2px);z-index:20}
.enemy-hud{top:8px;left:8px;min-width:180px}
.player-hud{bottom:88px;right:8px;min-width:180px}
.hud-name{font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.hud-level{font-weight:400;font-size:9px;color:#E84B2B}
.hp-track{height:5px;background:#222;border-radius:3px;margin-top:2px;border:1px solid #444}
.hp-fill{height:100%;background:linear-gradient(90deg,#43A047,#66BB6A);border-radius:2px;width:100%}
.hp-text{font-size:8px;text-align:right;color:#66BB6A;margin-top:1px;font-weight:700}

.menu{position:absolute;bottom:0;left:0;right:0;height:80px;background:rgba(10,10,10,0.92);border-top:2px solid #E84B2B;display:flex;align-items:center;padding:8px 15px;z-index:20}
.menu-text{flex:1;font-size:12px;color:#F5F0E8cc;line-height:1.3}
.menu-text strong{color:#F5F0E8}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.btn{padding:8px 24px;font-family:'Kanit',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;border:none;border-radius:6px;color:white;cursor:pointer}
.b1{background:#C62828}.b2{background:#1565C0}.b3{background:#2E7D32}.b4{background:#E65100}
</style></head><body>
<h1>Battle Mockup — Peñalver Final</h1>
<div class="battle">
  <img class="bg" src="penalver-original.png">

  <div class="unit enemy-unit">
    <img class="sprite" src="cogollito-sw-trimmed.png">
    <div class="oval"></div>
  </div>

  <div class="unit player-unit">
    <img class="sprite" src="mechita-ne-trimmed.png">
    <div class="oval"></div>
  </div>

  <div class="hud enemy-hud">
    <div class="hud-name">Cogollito <span class="hud-level">Lv.5</span></div>
    <div class="hp-track"><div class="hp-fill"></div></div>
    <div class="hp-text">19/19</div>
  </div>
  <div class="hud player-hud">
    <div class="hud-name">Mechita <span class="hud-level">Lv.7</span></div>
    <div class="hp-track"><div class="hp-fill"></div></div>
    <div class="hp-text">22/22</div>
  </div>
  <div class="menu">
    <div class="menu-text">¿Qué debería hacer<br><strong>MECHITA</strong>?</div>
    <div class="btns">
      <button class="btn b1">ATACAR</button>
      <button class="btn b2">CAMBIAR</button>
      <button class="btn b3">ITEM</button>
      <button class="btn b4">HUIR</button>
    </div>
  </div>
</div>
</body></html>

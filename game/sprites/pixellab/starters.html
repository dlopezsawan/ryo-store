<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Starters — PixelLab Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1A1A1A;color:#F5F0E8;font-family:'Kanit',sans-serif;padding:30px}
h1{text-align:center;font-size:2rem;font-weight:900;color:#E84B2B;margin-bottom:30px}
.line{background:#2a2a2a;border:2px solid #333;padding:20px;margin-bottom:20px;max-width:900px;margin-left:auto;margin-right:auto}
.line h2{color:#E84B2B;font-size:1rem;font-weight:900;text-transform:uppercase;margin-bottom:15px}
.evos{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.evo{text-align:center}
.evo .sprites{display:flex;gap:5px;margin-bottom:5px}
.evo img{image-rendering:pixelated;background:rgba(255,255,255,0.05);border:1px solid #444;padding:3px}
.evo .name{font-size:.75rem;font-weight:700;text-transform:uppercase}
.evo .label{font-size:.55rem;color:#F5F0E888}
.arrow{font-size:1.5rem;color:#E84B2B;align-self:center;padding:0 5px}
.s1 img{width:80px;height:80px}
.s2 img{width:96px;height:96px}
.s3 img{width:112px;height:112px}
</style>
</head>
<body>
<h1>Starters — PixelLab Pro Quality</h1>

<div class="line">
<h2>🌿 Línea Hierba</h2>
<div class="evos">
<div class="evo s1"><div class="sprites"><img src="cogollito-front.png"><img src="cogollito-back.png"></div><div class="name">Cogollito</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s2"><div class="sprites"><img src="cogollero-front.png"><img src="cogollero-back.png"></div><div class="name">Cogollero</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s3"><div class="sprites"><img src="cogolord-front.png"><img src="cogolord-back.png"></div><div class="name">Cogolord</div><div class="label">front / back</div></div>
</div></div>

<div class="line">
<h2>🔥 Línea Brasa</h2>
<div class="evos">
<div class="evo s1"><div class="sprites"><img src="mechita-front.png"><img src="mechita-back.png"></div><div class="name">Mechita</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s2"><div class="sprites"><img src="flamero-front.png"><img src="flamero-back.png"></div><div class="name">Flamero</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s3"><div class="sprites"><img src="infernal-front.png"><img src="infernal-back.png"></div><div class="name">Inferñal</div><div class="label">front / back</div></div>
</div></div>

<div class="line">
<h2>💧 Línea Agua</h2>
<div class="evos">
<div class="evo s1"><div class="sprites"><img src="gotirro-front.png"><img src="gotirro-back.png"></div><div class="name">Gotirro</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s2"><div class="sprites"><img src="cabrialin-front.png"><img src="cabrialin-back.png"></div><div class="name">Cabrialín</div><div class="label">front / back</div></div>
<div class="arrow">→</div>
<div class="evo s3"><div class="sprites"><img src="cabriator-front.png"><img src="cabriator-back.png"></div><div class="name">Cabriator</div><div class="label">front / back</div></div>
</div></div>

</body></html>

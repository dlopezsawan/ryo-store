services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.enrola.shop
    restart: unless-stopped
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - mail-config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=
      - PERMIT_DOCKER=network
      - ONE_DIR=1
      - POSTMASTER_ADDRESS=admin@enrola.shop
    networks:
      - n8n_default

  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    restart: unless-stopped
    volumes:
      - snappymail-data:/var/lib/snappymail
    labels:
      - traefik.enable=true
      - traefik.http.routers.webmail.rule=Host(`mail.enrola.shop`)
      - traefik.http.routers.webmail.tls=true
      - traefik.http.routers.webmail.entrypoints=websecure
      - traefik.http.routers.webmail.tls.certresolver=mytlschallenge
      - traefik.http.services.webmail.loadbalancer.server.port=8888
    networks:
      - n8n_default

volumes:
  mail-data:
  mail-state:
  mail-logs:
  mail-config:
  snappymail-data:

networks:
  n8n_default:
    external: true

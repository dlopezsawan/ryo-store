<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--secondary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 168px; line-height: 0.86;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .compare {
      display: flex; flex-direction: column; justify-content: center;
      gap: 22px;
    }
    .scene {
      padding: 32px 36px;
      border: 5px solid var(--dark);
      box-shadow: 10px 10px 0 0 var(--dark);
      display: grid; grid-template-columns: auto 1fr 140px; align-items: center; gap: 28px;
    }
    .scene-photo { width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
    .scene-photo img { max-width: 100%; max-height: 100%; object-fit: contain; transform: rotate(-6deg); filter: drop-shadow(6px 6px 0 rgba(26,26,26,0.25)); }
    .scene.bad .scene-photo {
      background:
        radial-gradient(circle at 50% 50%, rgba(150,90,50,0.45), transparent 70%),
        repeating-linear-gradient(45deg, rgba(80,50,30,0.15) 0 6px, transparent 6px 12px);
      border: 3px dashed rgba(26,26,26,0.25);
      border-radius: 50%;
    }
    .scene.bad { background: #E8DFC8; }
    .scene.good { background: var(--orange); color: var(--cream); }
    .feel { font-weight: 900; font-size: 56px; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; }
    .scene.bad .feel { color: var(--primary); }
    .scene.good .feel { color: var(--cream); }
    .label-stack { display: flex; flex-direction: column; gap: 6px; }
    .label-name { font-weight: 800; font-size: 36px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
    .label-meta { font-weight: 600; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(26,26,26,0.55); }
    .scene.good .label-meta { color: rgba(245,242,232,0.85); }
    .icon {
      font-weight: 900; font-size: 28px; letter-spacing: 0.18em;
      padding: 12px 20px; text-transform: uppercase;
      border: 4px solid var(--dark);
    }
    .scene.bad .icon { background: var(--dark); color: var(--cream); }
    .scene.good .icon { background: var(--cream); color: var(--dark); border-color: var(--cream); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">¿Por qué te raspa?</div>
      <div class="h1">La diferencia<br/><span class="em">se siente.</span></div>
    </div>

    <div class="compare">
      <div class="scene bad">
        <div class="feel">Raspa</div>
        <div class="label-stack">
          <div class="label-name">Sin filtro</div>
          <div class="label-meta">Humo crudo · partículas</div>
        </div>
        <div class="scene-photo"></div>
      </div>
      <div class="scene good">
        <div class="feel">Suave</div>
        <div class="label-stack">
          <div class="label-name">Carbón activo</div>
          <div class="label-meta">Atrapa lo que sobra</div>
        </div>
        <div class="scene-photo"><img src="../../assets/products/filtros-carbon.webp" alt="Filtro carbón"/></div>
      </div>
    </div>

    <div class="cta">
      <div class="label"><span class="em">10 filtros · €7</span> · enrola.shop</div>
    </div>
  </div>
</body>
</html>

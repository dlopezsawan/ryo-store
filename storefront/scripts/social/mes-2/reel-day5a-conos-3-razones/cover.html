<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--primary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { display: grid; grid-template-columns: 1fr 320px; align-items: end; gap: 24px; }
    .hero-text { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 168px; line-height: 0.86;
      letter-spacing: -0.05em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }
    .hero-photo { width: 320px; height: 240px; display: flex; align-items: center; justify-content: center; }
    .hero-photo img { max-width: 100%; max-height: 100%; object-fit: contain; transform: rotate(-6deg); filter: drop-shadow(12px 12px 0 var(--primary)); }

    .reasons {
      display: flex; flex-direction: column; justify-content: center;
      gap: 22px;
    }
    .reason {
      display: flex; align-items: center; gap: 28px;
      padding: 28px 32px;
      background: var(--cream);
      border: 5px solid var(--dark);
      box-shadow: 10px 10px 0 0 var(--dark);
    }
    .reason-icon { font-size: 80px; line-height: 1; flex: 0 0 auto; }
    .reason-num { font-weight: 900; font-size: 88px; line-height: 1; color: var(--primary); letter-spacing: -0.05em; flex: 0 0 auto; }
    .reason-text { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .reason-title { font-weight: 900; font-size: 44px; letter-spacing: -0.01em; line-height: 1; text-transform: uppercase; }
    .reason-sub { font-weight: 600; font-size: 22px; letter-spacing: 0.08em; color: rgba(26,26,26,0.55); text-transform: uppercase; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="hero-text">
        <div class="eyebrow">Si armas todos los días</div>
        <div class="h1">3 razones<br/><span class="em">conos.</span></div>
      </div>
      <div class="hero-photo"><img src="../../assets/products/conos.webp" alt="Conos"/></div>
    </div>

    <div class="reasons">
      <div class="reason">
        <div class="reason-num">1</div>
        <div class="reason-text">
          <div class="reason-title">Velocidad</div>
          <div class="reason-sub">Listo en segundos · vs 30s a mano</div>
        </div>
      </div>
      <div class="reason">
        <div class="reason-num">2</div>
        <div class="reason-text">
          <div class="reason-title">Consistencia</div>
          <div class="reason-sub">12 iguales · cero irregulares</div>
        </div>
      </div>
      <div class="reason">
        <div class="reason-num">3</div>
        <div class="reason-text">
          <div class="reason-title">Comodidad</div>
          <div class="reason-sub">Sin manos sucias · sin moledero</div>
        </div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Conos <span class="em">Hemp Natural</span> · 12 uds en enrola.shop</div>
    </div>
  </div>
</body>
</html>

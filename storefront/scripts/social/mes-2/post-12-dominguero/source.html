<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/shared.css">
<style>
  .frame { background: var(--cream); }

  /* head-stack — top, tight */
  .head-stack {
    position: absolute; left: 64px; right: 64px;
    top: 140px; z-index: 3;
    display: flex; flex-direction: column; gap: 4px;
  }
  .eyebrow {
    font-weight: 700; font-size: 24px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--primary);
  }
  .h1 {
    font-weight: 900; font-size: 156px; line-height: 0.88;
    letter-spacing: -0.05em; text-transform: uppercase;
    color: var(--dark);
  }
  .h1 .em { color: var(--primary); }
  .ask {
    font-weight: 700; font-size: 26px; line-height: 1.3;
    letter-spacing: 0.04em; color: var(--secondary);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* product grid — editorial flat-lay, 2×2 with labeled cards */
  .grid {
    position: absolute;
    left: 64px; right: 64px;
    top: 540px; bottom: 120px;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 28px;
  }
  .card {
    position: relative;
    background: var(--cream);
    border: 5px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--dark);
    display: flex; align-items: center; justify-content: center;
    padding: 20px 18px 48px 18px;
    overflow: hidden;
  }
  .card.alt { box-shadow: 10px 10px 0 0 var(--orange); }
  .card.dark-alt { box-shadow: 10px 10px 0 0 var(--primary); }
  .card.olive { box-shadow: 10px 10px 0 0 var(--secondary); }
  .card img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(6px 6px 0 rgba(26,26,26,0.22));
  }
  .card .label {
    position: absolute; left: 12px; right: 12px; bottom: 12px;
    font-weight: 900; font-size: 20px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dark);
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px;
  }
  .card .label .price {
    color: var(--primary); font-weight: 900;
    white-space: nowrap;
  }

  /* subtle decorative sticker top-right of each product img */
  .card .num {
    position: absolute; top: 10px; left: 14px;
    font-weight: 700; font-size: 14px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--secondary);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">Dom · 05·24</div>
    </div>

    <div class="head-stack">
      <div class="eyebrow">Sunday mood</div>
      <div class="h1"><span class="em">Dominguero.</span></div>
      <div class="ask">¿Qué están armando hoy?</div>
    </div>

    <div class="grid">
      <div class="card alt">
        <span class="num">01</span>
        <img src="file:///Users/daniellopez/Desktop/ryo store/storefront/scripts/social/assets/products/papers-alien.webp"
             style="transform: rotate(-3deg);">
        <div class="label"><span>Alien Puff</span><span class="price">€2.50</span></div>
      </div>
      <div class="card">
        <span class="num">02</span>
        <img src="file:///Users/daniellopez/Desktop/ryo store/storefront/scripts/social/assets/products/grinder-basic.webp"
             style="transform: rotate(5deg); max-height: 78%;">
        <div class="label"><span>Grinder</span><span class="price">€6</span></div>
      </div>
      <div class="card olive">
        <span class="num">03</span>
        <img src="file:///Users/daniellopez/Desktop/ryo store/storefront/scripts/social/assets/products/conos.webp"
             style="transform: rotate(-4deg); max-height: 84%;">
        <div class="label"><span>Conos RP</span><span class="price">€10</span></div>
      </div>
      <div class="card dark-alt">
        <span class="num">04</span>
        <img src="file:///Users/daniellopez/Desktop/ryo store/storefront/scripts/social/assets/products/filtros-carbon.webp"
             style="transform: rotate(4deg); max-height: 80%;">
        <div class="label"><span>Filtros Carbón</span><span class="price">€7</span></div>
      </div>
    </div>
  </div>
</body></html>

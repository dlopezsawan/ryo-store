<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--dark); color: var(--cream);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--cream); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--orange); color: var(--cream);
      border: 4px solid var(--cream); box-shadow: 6px 6px 0 0 var(--orange);
    }

    .hero { text-align: center; }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.42em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 14px;
    }
    .h1 {
      font-weight: 900; font-size: 200px; line-height: 0.84;
      letter-spacing: -0.05em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .stats {
      display: flex; flex-direction: column; justify-content: center;
      gap: 20px;
    }
    .stat {
      display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 32px;
      padding: 28px 36px;
      background: rgba(255,255,255,0.04);
      border: 4px solid var(--cream);
      box-shadow: 12px 12px 0 0 var(--orange);
    }
    .stat-num { font-weight: 900; font-size: 140px; line-height: 1; color: var(--orange); letter-spacing: -0.06em; text-align: right; }
    .stat-text { display: flex; flex-direction: column; gap: 4px; }
    .stat-name { font-weight: 900; font-size: 48px; letter-spacing: -0.01em; line-height: 1; text-transform: uppercase; }
    .stat-meta { font-weight: 600; font-size: 22px; letter-spacing: 0.10em; color: rgba(245,242,232,0.6); text-transform: uppercase; }

    .scarcity { text-align: center; font-style: italic; font-size: 28px; color: rgba(245,242,232,0.55); letter-spacing: 0.06em; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--orange); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Edición limitada</div>
      <div class="h1">No la consigues<br/><span class="em">mañana.</span></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">5</div>
        <div class="stat-text">
          <div class="stat-name">Unidades</div>
          <div class="stat-meta">Stock real · una por persona</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-num">1</div>
        <div class="stat-text">
          <div class="stat-name">Artista</div>
          <div class="stat-meta">Ilustración exclusiva</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-num">1</div>
        <div class="stat-text">
          <div class="stat-name">Ciudad</div>
          <div class="stat-meta">Valencia · Venezuela</div>
        </div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Drop pronto · <span class="em">solo en bio</span></div>
    </div>
  </div>
</body>
</html>

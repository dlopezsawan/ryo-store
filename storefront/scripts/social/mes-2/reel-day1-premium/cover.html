<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 36px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--primary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 168px; line-height: 0.86;
      letter-spacing: -0.05em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .compare {
      display: flex; flex-direction: column; justify-content: center;
      gap: 22px;
    }
    .row {
      background: var(--cream);
      border: 5px solid var(--dark);
      box-shadow: 10px 10px 0 0 var(--dark);
      padding: 26px 32px;
      display: grid;
      grid-template-rows: auto auto;
      gap: 16px;
    }
    .row-title { font-weight: 900; font-size: 38px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; color: var(--dark); }
    .row-title .em { color: var(--primary); }
    .duel { display: flex; align-items: stretch; gap: 16px; }
    .cell { flex: 1; padding: 22px 24px; border: 4px solid var(--dark); display: flex; flex-direction: column; gap: 4px; }
    .cell.enrola { background: var(--orange); color: var(--cream); }
    .cell.them { background: #FFFFFF; }
    .cell-price { font-weight: 900; font-size: 78px; line-height: 1; letter-spacing: -0.04em; }
    .cell.them .cell-price { color: var(--primary); }
    .cell-meta { font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; }
    .cell.enrola .cell-meta { color: rgba(245,242,232,0.85); }
    .cell.them .cell-meta { color: rgba(26,26,26,0.55); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Premium · sin pagar logo</div>
      <div class="h1">Más papel.<br/><span class="em">Menos plata.</span></div>
    </div>

    <div class="compare">
      <div class="row">
        <div class="row-title">Alien Puff <span class="em">King Size</span></div>
        <div class="duel">
          <div class="cell enrola">
            <div class="cell-price">€2.50</div>
            <div class="cell-meta">Enrola · King</div>
          </div>
          <div class="cell them">
            <div class="cell-price">€4</div>
            <div class="cell-meta">Otras · 1¼ (más chico)</div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="row-title">Conos <span class="em">Celulosa</span></div>
        <div class="duel">
          <div class="cell enrola">
            <div class="cell-price">€3</div>
            <div class="cell-meta">Enrola</div>
          </div>
          <div class="cell them">
            <div class="cell-price">€4</div>
            <div class="cell-meta">Otras tiendas</div>
          </div>
        </div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Catálogo en <span class="em">enrola.shop</span></div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: linear-gradient(170deg, #221610 0%, #3A2820 60%, #4D3424 100%);
      color: var(--cream);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      row-gap: 36px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--cream); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--orange); color: var(--cream);
      border: 4px solid var(--cream); box-shadow: 6px 6px 0 0 var(--orange);
    }

    .scene {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .sun {
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #F5C97E 0%, #D89B4C 50%, #8C4F2A 100%);
      box-shadow: 0 0 120px 40px rgba(245, 201, 126, 0.35);
      position: relative;
    }
    .sun::after {
      content: ""; position: absolute; inset: -40px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0deg, transparent 350deg, rgba(245,201,126,0.25) 360deg);
      filter: blur(4px);
    }
    .steam {
      position: absolute; left: 50%; top: 30%;
      transform: translate(-50%, -50%);
      width: 200px; height: 240px;
      background:
        radial-gradient(40px 80px at 30% 30%, rgba(245,242,232,0.4), transparent 60%),
        radial-gradient(50px 100px at 70% 50%, rgba(245,242,232,0.35), transparent 60%),
        radial-gradient(30px 70px at 40% 80%, rgba(245,242,232,0.3), transparent 60%);
      filter: blur(6px);
    }

    .hero { text-align: center; }
    .eyebrow { font-weight: 700; font-size: 30px; letter-spacing: 0.42em; text-transform: uppercase; color: rgba(245,242,232,0.7); margin-bottom: 16px; }
    .h1 {
      font-weight: 900; font-size: 200px; line-height: 0.86;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--orange); font-weight: 900; text-transform: uppercase; }
    .cta .tagline { font-style: italic; font-size: 24px; color: rgba(245,242,232,0.5); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="scene">
      <div class="sun"><div class="steam"></div></div>
    </div>

    <div class="hero">
      <div class="eyebrow">Lo-fi · Sin prisa</div>
      <div class="h1">Ritual<br/><span class="em">mañana.</span></div>
    </div>

    <div class="cta">
      <div class="label">El arte de armar · <span class="em">enrola.shop</span></div>
      <div class="tagline">Café, papers, calma.</div>
    </div>
  </div>
</body>
</html>

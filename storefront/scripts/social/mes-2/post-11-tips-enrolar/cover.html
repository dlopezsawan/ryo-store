<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/shared.css">
<style>
  html, body { height: 1920px; }
  .frame { background: var(--cream); height: 1920px; }

  .cover-top {
    position: absolute; top: 240px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center; z-index: 3;
  }
  .cover-brand {
    font-weight: 900; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--dark); display: flex; align-items: center; gap: 14px;
  }
  .cover-brand .dot { width: 14px; height: 14px; background: var(--primary); border: 3px solid currentColor; }
  .cover-badge {
    font-weight: 900; font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 18px; background: var(--primary); color: var(--cream);
    border: 3px solid var(--dark); box-shadow: 5px 5px 0 0 var(--dark);
  }

  .cover-hero {
    position: absolute; left: 64px; right: 64px; top: 460px; z-index: 2;
    display: flex; flex-direction: column; gap: 20px;
  }
  .eyebrow {
    font-weight: 700; font-size: 36px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--primary);
  }
  .cover-h1 {
    font-weight: 900; font-size: 190px; line-height: 0.84;
    letter-spacing: -0.05em; text-transform: uppercase; color: var(--dark);
    display: flex; align-items: baseline; gap: 22px;
  }
  .cover-h1 .em {
    color: var(--cream);
    background: var(--primary);
    font-size: 280px; line-height: 0.9;
    padding: 0 24px; border: 6px solid var(--dark);
    box-shadow: 12px 12px 0 0 var(--dark);
    letter-spacing: -0.02em;
    display: inline-block;
  }
  .cover-sub {
    font-weight: 900; font-size: 56px; line-height: 1.1;
    letter-spacing: 0.02em; text-transform: uppercase; color: var(--dark);
    margin-top: 4px;
  }

  .errors {
    position: absolute; left: 64px; right: 64px; bottom: 360px; z-index: 2;
    display: flex; flex-direction: column; gap: 16px;
  }
  .err {
    display: flex; align-items: center; gap: 20px;
    padding: 22px 28px; background: var(--cream);
    border: 5px solid var(--dark); box-shadow: 9px 9px 0 0 var(--dark);
    font-weight: 700; font-size: 32px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .err .x {
    width: 60px; height: 60px; background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 36px; color: var(--cream);
    border: 3px solid var(--dark); flex-shrink: 0;
  }
</style></head>
<body>
  <div class="frame reel">
    <div class="cover-top">
      <div class="cover-brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="cover-badge">Reel · 11 · Tips</div>
    </div>

    <div class="cover-hero">
      <div class="eyebrow">Educational · Tips</div>
      <div class="cover-h1"><span class="em">3</span> errores</div>
      <div class="cover-sub">al enrolar.</div>
    </div>

    <div class="errors">
      <div class="err"><div class="x">✕</div>Muy poco material</div>
      <div class="err"><div class="x">✕</div>Armar sin filtro</div>
      <div class="err"><div class="x">✕</div>Grinder sucio</div>
    </div>
  </div>
</body></html>

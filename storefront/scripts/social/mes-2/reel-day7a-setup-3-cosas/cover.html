<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--primary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 168px; line-height: 0.86;
      letter-spacing: -0.05em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }
    .h1 .strike { text-decoration: line-through; text-decoration-thickness: 12px; text-decoration-color: var(--orange); color: var(--secondary); }

    .stack {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
      align-content: center;
    }
    .item {
      padding: 30px 22px;
      background: var(--cream);
      border: 5px solid var(--dark);
      box-shadow: 10px 10px 0 0 var(--dark);
      display: flex; flex-direction: column; align-items: center;
      gap: 14px;
    }
    .item.flagship { background: var(--orange); color: var(--cream); }
    .item-num { font-weight: 900; font-size: 80px; line-height: 1; color: var(--primary); letter-spacing: -0.05em; }
    .item.flagship .item-num { color: var(--cream); }
    .item-icon { width: 100%; height: 130px; display: flex; align-items: center; justify-content: center; }
    .item-icon img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(4px 4px 0 rgba(26,26,26,0.25)); }
    .item-name { font-weight: 900; font-size: 38px; letter-spacing: -0.01em; line-height: 1; text-transform: uppercase; text-align: center; }
    .item-meta { font-weight: 600; font-size: 18px; letter-spacing: 0.10em; text-transform: uppercase; color: rgba(26,26,26,0.55); text-align: center; line-height: 1.2; }
    .item.flagship .item-meta { color: rgba(245,242,232,0.85); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Tu setup esencial</div>
      <div class="h1"><span class="strike">10 cosas.</span><br/>Solo <span class="em">3.</span></div>
    </div>

    <div class="stack">
      <div class="item">
        <div class="item-num">1</div>
        <div class="item-icon"><img src="../../assets/products/papers-alien.webp" alt="Papers"/></div>
        <div class="item-name">Papers</div>
        <div class="item-meta">Alien Puff · Marrón</div>
      </div>
      <div class="item">
        <div class="item-num">2</div>
        <div class="item-icon"><img src="../../assets/products/filtros-carbon.webp" alt="Filtros"/></div>
        <div class="item-name">Filtros</div>
        <div class="item-meta">Cartón o Carbón</div>
      </div>
      <div class="item flagship">
        <div class="item-num">3</div>
        <div class="item-icon"><img src="../../assets/products/grinder-basic.webp" alt="Grinder"/></div>
        <div class="item-name">Grinder</div>
        <div class="item-meta">Básico o rellenador</div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Combo en <span class="em">arma-tu-combo</span> · enrola.shop</div>
    </div>
  </div>
</body>
</html>

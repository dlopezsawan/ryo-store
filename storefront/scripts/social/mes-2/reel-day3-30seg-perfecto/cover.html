<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--dark); color: var(--cream);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 48px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--cream); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--orange); color: var(--cream);
      border: 4px solid var(--cream); box-shadow: 6px 6px 0 0 var(--orange);
    }

    .hero { text-align: center; }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 16px;
    }
    .timer {
      font-weight: 900; font-size: 360px; line-height: 0.85;
      letter-spacing: -0.06em; color: var(--cream);
      display: inline-flex; align-items: baseline; gap: 16px;
    }
    .timer .unit { font-size: 90px; color: var(--orange); letter-spacing: 0.04em; line-height: 1; font-weight: 900; }
    .h1 {
      margin-top: -12px;
      font-weight: 900; font-size: 100px; line-height: 0.92;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; align-content: center; }
    .step {
      padding: 28px 32px;
      background: rgba(255,255,255,0.06);
      border: 4px solid var(--cream);
      box-shadow: 8px 8px 0 0 var(--orange);
      display: flex; align-items: center; gap: 22px;
    }
    .step-num { font-weight: 900; font-size: 64px; color: var(--orange); line-height: 1; letter-spacing: -0.04em; flex: 0 0 auto; }
    .step-text { font-weight: 700; font-size: 28px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--orange); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Tutorial · 4 pasos</div>
      <div class="timer">30<span class="unit">SEG</span></div>
      <div class="h1">Armado<br/><span class="em">perfecto.</span></div>
    </div>

    <div class="steps">
      <div class="step"><span class="step-num">1</span><span class="step-text">Papel<br/>+ filtro</span></div>
      <div class="step"><span class="step-num">2</span><span class="step-text">Distribuir<br/>parejo</span></div>
      <div class="step"><span class="step-num">3</span><span class="step-text">Sellado<br/>preciso</span></div>
      <div class="step"><span class="step-num">4</span><span class="step-text">Filtro<br/>insertado</span></div>
    </div>

    <div class="cta">
      <div class="label">Filtros <span class="em">Carbón Activo</span> · 10 uds €7</div>
    </div>
  </div>
</body>
</html>

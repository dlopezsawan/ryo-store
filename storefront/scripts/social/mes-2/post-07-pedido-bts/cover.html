<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/shared.css">
<style>
  html, body { height: 1920px; }
  .frame { background: var(--cream); height: 1920px; }

  .cover-top {
    position: absolute; top: 240px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center; z-index: 3;
  }
  .cover-brand {
    font-weight: 900; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--dark); display: flex; align-items: center; gap: 14px;
  }
  .cover-brand .dot { width: 14px; height: 14px; background: var(--primary); border: 3px solid currentColor; }
  .cover-badge {
    font-weight: 900; font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 18px; background: var(--secondary); color: var(--cream);
    border: 3px solid var(--dark); box-shadow: 5px 5px 0 0 var(--dark);
  }

  .cover-hero {
    position: absolute; left: 64px; right: 64px; top: 460px; z-index: 2;
    display: flex; flex-direction: column; gap: 28px;
  }
  .eyebrow {
    font-weight: 700; font-size: 36px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--secondary);
  }
  .cover-h1 {
    font-weight: 900; font-size: 166px; line-height: 0.86;
    letter-spacing: -0.05em; text-transform: uppercase; color: var(--dark);
  }
  .cover-h1 .em { color: var(--primary); }
  .cover-sub {
    font-weight: 700; font-size: 36px; line-height: 1.25;
    letter-spacing: 0.02em; color: var(--dark);
  }

  /* Steps lifted from bottom:360 to 480 — at 360 the bottom of step 03
     hit the legal-footer (top ~1540), no breathing room. 480 keeps the
     full block inside the 1:1 grid-visible band (y=420-1500). */
  .steps {
    position: absolute; left: 64px; right: 64px; bottom: 480px; z-index: 2;
    display: flex; flex-direction: column; gap: 18px;
  }
  .step {
    display: flex; align-items: center; gap: 22px;
    padding: 24px 28px; background: var(--cream);
    border: 5px solid var(--dark); box-shadow: 9px 9px 0 0 var(--dark);
    font-weight: 900; font-size: 36px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .step .num {
    font-weight: 900; font-size: 58px; line-height: 1;
    color: var(--primary); letter-spacing: -0.04em;
  }
</style></head>
<body>
  <div class="frame reel">
    <div class="cover-top">
      <div class="cover-brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="cover-badge">Reel · 07 · BTS</div>
    </div>

    <div class="cover-hero">
      <div class="eyebrow">Behind the scenes</div>
      <div class="cover-h1">Así<br/><span class="em">armamos</span><br/>un pedido.</div>
    </div>

    <div class="steps">
      <div class="step"><span class="num">01</span>Elegir</div>
      <div class="step"><span class="num">02</span>Revisar</div>
      <div class="step"><span class="num">03</span>Sellar</div>
    </div>
  </div>
</body></html>

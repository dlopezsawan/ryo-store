<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/shared.css">
<style>
  html, body { height: 1920px; }
  .frame { background: var(--cream); height: 1920px; }

  .cover-top {
    position: absolute; top: 240px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center; z-index: 3;
  }
  .cover-brand {
    font-weight: 900; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--dark); display: flex; align-items: center; gap: 14px;
  }
  .cover-brand .dot { width: 14px; height: 14px; background: var(--primary); border: 3px solid currentColor; }
  .cover-badge {
    font-weight: 900; font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 18px; background: var(--orange); color: var(--cream);
    border: 3px solid var(--dark); box-shadow: 5px 5px 0 0 var(--dark);
  }

  .cover-hero {
    position: absolute; left: 64px; right: 64px; top: 460px; z-index: 2;
    display: flex; flex-direction: column; gap: 28px;
  }
  .eyebrow {
    font-weight: 700; font-size: 36px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--primary);
  }
  .cover-h1 {
    font-weight: 900; font-size: 180px; line-height: 0.86;
    letter-spacing: -0.05em; text-transform: uppercase; color: var(--dark);
  }
  .cover-h1 .em { color: var(--orange); }

  .tiers {
    position: absolute; left: 64px; right: 64px; bottom: 340px; z-index: 2;
    display: flex; flex-direction: column; gap: 20px;
  }
  .tier {
    display: flex; align-items: center; gap: 24px;
    padding: 30px 34px;
    border: 6px solid var(--dark); box-shadow: 12px 12px 0 0 var(--dark);
  }
  .tier.a { background: var(--cream); }
  .tier.b { background: var(--cream); }
  .tier.c { background: var(--orange); color: var(--cream); }
  .tier .count {
    font-weight: 900; font-size: 72px; line-height: 1; letter-spacing: -0.04em;
    color: var(--dark); flex-shrink: 0; min-width: 120px;
  }
  .tier.c .count { color: var(--cream); }
  .tier .label {
    font-weight: 700; font-size: 30px; letter-spacing: 0.05em;
    text-transform: uppercase; flex: 1;
  }
  .tier .off {
    font-weight: 900; font-size: 56px; line-height: 1;
    letter-spacing: -0.02em; color: var(--primary);
  }
  .tier.c .off { color: var(--cream); }
</style></head>
<body>
  <div class="frame reel">
    <div class="cover-top">
      <div class="cover-brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="cover-badge">Reel · 09 · Promo</div>
    </div>

    <div class="cover-hero">
      <div class="eyebrow">Sin cupón · sin código</div>
      <div class="cover-h1">Mezcla<br/><span class="em">y ahorra.</span></div>
    </div>

    <div class="tiers">
      <div class="tier a">
        <div class="count">3+</div>
        <div class="label">items mezclados</div>
        <div class="off">10%</div>
      </div>
      <div class="tier b">
        <div class="count">5+</div>
        <div class="label">items mezclados</div>
        <div class="off">15%</div>
      </div>
      <div class="tier c">
        <div class="count">10+</div>
        <div class="label">items mezclados</div>
        <div class="off">20%</div>
      </div>
    </div>
  </div>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .frame { background: var(--cream); }
  .hero {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
    display: flex; flex-direction: column; gap: 22px;
  }
  .eyebrow {
    font-weight: 700; font-size: 26px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--primary);
  }
  .h1 {
    font-weight: 900; font-size: 220px; line-height: 0.88;
    letter-spacing: -0.05em; text-transform: uppercase;
    color: var(--dark);
  }
  .h1.smaller { font-size: 132px; }
  .h1 .em { color: var(--primary); }
  .sub {
    font-weight: 700; font-size: 32px; line-height: 1.25;
    letter-spacing: 0.02em; color: var(--dark);
  }
  .note {
    font-weight: 600; font-size: 22px; line-height: 1.3;
    color: var(--secondary); margin-top: 6px;
  }

  .date-pill, .cta-pill {
    display: inline-block; align-self: flex-start;
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 48px; line-height: 1;
    padding: 14px 24px;
    border: 5px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--dark);
    transform: rotate(-1.5deg);
  }

  .ranking { display: flex; flex-direction: column; gap: 14px; }
  .rank-item {
    display: flex; align-items: center; gap: 20px;
    padding: 20px 24px;
    background: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 8px 8px 0 0 var(--dark);
  }
  .rank-num {
    width: 64px; height: 64px;
    background: var(--primary); color: var(--cream);
    display: inline-flex; align-items: center; justify-content: center;
    border: 4px solid var(--dark);
    font-weight: 900; font-size: 38px; flex-shrink: 0;
  }
  .rank-name {
    flex: 1;
    font-weight: 700; font-size: 30px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .rank-price {
    font-weight: 900; font-size: 32px;
    color: var(--primary);
  }

  .sabor-card {
    display: flex; align-items: center; gap: 22px;
    padding: 24px;
    background: var(--cream);
    border: 5px solid var(--dark);
    box-shadow: 12px 12px 0 0 var(--primary);
  }
  .sabor-swatch {
    width: 140px; height: 140px;
    border: 4px solid var(--dark);
    flex-shrink: 0;
  }
  .sabor-info { display: flex; flex-direction: column; gap: 4px; }
  .sabor-name {
    font-weight: 900; font-size: 58px; line-height: 1;
    text-transform: uppercase; color: var(--dark);
    letter-spacing: -0.02em;
  }
  .sabor-family {
    font-weight: 700; font-size: 24px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--primary);
  }

  .combo { display: flex; flex-direction: column; gap: 14px; }
  .combo-item {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 24px;
    background: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 8px 8px 0 0 var(--dark);
  }
  .check {
    width: 44px; height: 44px;
    background: var(--orange); color: var(--cream);
    display: inline-flex; align-items: center; justify-content: center;
    border: 4px solid var(--dark);
    font-weight: 900; font-size: 24px;
    flex-shrink: 0;
  }
  .combo-name {
    font-weight: 700; font-size: 28px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 / 05</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Combo favorito</div>
      <div class="h1 smaller">El<br/><span class="em">trío.</span></div>
      <div class="combo">
        <div class="combo-item"><div class="check">✓</div><div class="combo-name">Rolling Paper Marrón</div></div>
        <div class="combo-item"><div class="check">✓</div><div class="combo-name">Filtros Carbón Activo</div></div>
        <div class="combo-item"><div class="check">✓</div><div class="combo-name">Grinder Plástico 60mm</div></div>
      </div>
      <div class="note">El combo más repetido este primer mes.</div>
    </div>

    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Mezcla<br/><span class='accent'>lo que quieras</span></div>
    </div>
  </div>
</body></html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--secondary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 144px; line-height: 0.88;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }
    .h1 .small { font-size: 56px; font-weight: 700; color: var(--secondary); letter-spacing: 0.02em; line-height: 1.1; display: block; margin-top: 12px; text-transform: none; }

    .tips {
      display: flex; flex-direction: column; justify-content: center;
      gap: 22px;
    }
    .tip {
      display: grid;
      grid-template-columns: 110px 1fr auto; align-items: center; gap: 24px;
      padding: 26px 32px;
      background: var(--cream);
      border: 5px solid var(--dark);
      box-shadow: 10px 10px 0 0 var(--dark);
    }
    .tip-icon {
      width: 110px; height: 110px;
      background: var(--orange);
      border: 5px solid var(--dark);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px;
    }
    .tip-text { display: flex; flex-direction: column; gap: 4px; }
    .tip-title { font-weight: 900; font-size: 40px; letter-spacing: -0.01em; line-height: 1; text-transform: uppercase; }
    .tip-meta { font-weight: 600; font-size: 22px; letter-spacing: 0.06em; color: rgba(26,26,26,0.55); text-transform: uppercase; }
    .tip-num { font-weight: 900; font-size: 64px; line-height: 1; color: var(--primary); letter-spacing: -0.04em; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Si se rasga al armar...</div>
      <div class="h1">No es el papel.<br/><span class="em">Eres tú.</span></div>
    </div>

    <div class="tips">
      <div class="tip">
        <div class="tip-icon">💧</div>
        <div class="tip-text">
          <div class="tip-title">Sin humedad</div>
          <div class="tip-meta">Lejos del baño · de la cocina</div>
        </div>
        <div class="tip-num">1</div>
      </div>
      <div class="tip">
        <div class="tip-icon">🔒</div>
        <div class="tip-text">
          <div class="tip-title">Hermético</div>
          <div class="tip-meta">Caja · zip · frasco</div>
        </div>
        <div class="tip-num">2</div>
      </div>
      <div class="tip">
        <div class="tip-icon">🌑</div>
        <div class="tip-text">
          <div class="tip-title">Sin sol</div>
          <div class="tip-meta">Cajón · oscuro · fresco</div>
        </div>
        <div class="tip-num">3</div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Papers premium <span class="em">duran si los cuidas</span></div>
    </div>
  </div>
</body>
</html>

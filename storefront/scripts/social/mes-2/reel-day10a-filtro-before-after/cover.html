<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 40px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--primary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 16px;
    }
    .h1 {
      font-weight: 900; font-size: 168px; line-height: 0.86;
      letter-spacing: -0.05em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .duel {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
      align-content: center;
    }
    .panel {
      padding: 36px 32px;
      border: 5px solid var(--dark);
      box-shadow: 12px 12px 0 0 var(--dark);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .panel.before { background: #C8A480; color: var(--dark); }
    .panel.after { background: var(--orange); color: var(--cream); }
    .panel-tag {
      font-weight: 900; font-size: 22px; letter-spacing: 0.20em;
      padding: 8px 18px; text-transform: uppercase;
      border: 3px solid var(--dark);
    }
    .panel.before .panel-tag { background: var(--cream); color: var(--dark); }
    .panel.after .panel-tag { background: var(--cream); color: var(--orange); border-color: var(--cream); }
    .filter-vis {
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
    }
    .filter-vis img { max-width: 100%; max-height: 100%; object-fit: contain; transform: rotate(-6deg); filter: drop-shadow(8px 8px 0 rgba(26,26,26,0.3)); }
    .panel.before .filter-vis {
      background:
        radial-gradient(circle at 30% 30%, rgba(150, 90, 50, 0.5), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(80, 50, 30, 0.6), transparent 60%),
        #B07840;
      border-radius: 50%;
      border: 6px solid var(--dark);
      font-size: 92px;
    }
    .panel.after .filter-vis {
      filter: drop-shadow(0 0 20px rgba(245,242,232,0.4));
    }
    .panel-name { font-weight: 900; font-size: 40px; letter-spacing: -0.01em; line-height: 1; text-transform: uppercase; text-align: center; }
    .panel-meta { font-weight: 700; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.2; text-align: center; opacity: 0.85; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Mira lo que bloquea</div>
      <div class="h1">Antes /<br/><span class="em">Después.</span></div>
    </div>

    <div class="duel">
      <div class="panel before">
        <div class="panel-tag">Antes</div>
        <div class="filter-vis">🟫</div>
        <div class="panel-name">Sin filtro</div>
        <div class="panel-meta">Residuo amarillento</div>
      </div>
      <div class="panel after">
        <div class="panel-tag">Después</div>
        <div class="filter-vis"><img src="../../assets/products/filtros-carbon.webp" alt="Filtro carbón"/></div>
        <div class="panel-name">Carbón activo</div>
        <div class="panel-meta">Limpio · suave</div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Filtros <span class="em">€7 los 10</span> · Cambian todo</div>
    </div>
  </div>
</body>
</html>

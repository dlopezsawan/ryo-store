<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .frame { background: var(--cream); }
  .hero-stack {
    position: absolute; left: 64px; right: 64px;
    top: 160px; z-index: 2;
    display: flex; flex-direction: column; gap: 14px;
  }
  .eyebrow {
    font-weight: 700; font-size: 26px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--primary);
  }
  .h1 {
    font-weight: 900; font-size: 112px; line-height: 0.92;
    letter-spacing: -0.035em; text-transform: uppercase;
    color: var(--dark);
  }
  .h1 .em { color: var(--primary); }
  .sub {
    font-weight: 600; font-size: 26px; line-height: 1.25;
    letter-spacing: 0.02em; color: var(--secondary);
    max-width: 880px;
  }
  .swatches {
    position: absolute; left: 64px; right: 64px;
    top: 560px; z-index: 2;
    display: flex; flex-direction: column; gap: 14px;
  }
  .swatch {
    display: flex; align-items: center; gap: 20px;
    padding: 14px 20px;
    background: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 8px 8px 0 0 var(--dark);
  }
  .sq {
    width: 56px; height: 56px;
    border: 3px solid var(--dark);
    flex-shrink: 0;
  }
  .name {
    font-weight: 700; font-size: 32px; letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .cta-block {
    position: absolute; bottom: 160px; left: 64px; right: 64px;
    background: var(--dark); color: var(--cream);
    padding: 20px 24px;
    font-weight: 700; font-size: 22px; line-height: 1.3;
    letter-spacing: 0.02em; text-transform: uppercase;
    z-index: 2;
  }
  .cta-block .em { color: var(--orange); font-weight: 900; }
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">03 / 04</div>
    </div>

    <div class="hero-stack">
      <div class="eyebrow">Alien Puff</div>
      <div class="h1"><span class="em">Aromáticos.</span></div>
      <div class="sub">4 perfiles balanceados, mid notes.</div>
    </div>

    <div class="swatches">
        <div class="swatch"><div class="sq" style="background: #4E2A1A;"></div><div class="name">Chocolate</div></div>
        <div class="swatch"><div class="sq" style="background: #46A97A;"></div><div class="name">Menta</div></div>
        <div class="swatch"><div class="sq" style="background: #D8A43A;"></div><div class="name">Miel</div></div>
        <div class="swatch"><div class="sq" style="background: #EED9A7;"></div><div class="name">Vainilla</div></div>
    </div>


    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Rolling Paper<br/><span class="accent">€2.50</span></div>
    </div>
  </div>
</body></html>

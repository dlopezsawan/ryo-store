<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .frame { background: var(--cream); }

  /* Text block pinned to top */
  .hero-text {
    position: absolute; left: 64px; right: 64px; top: 170px;
    z-index: 3;
    display: flex; flex-direction: column; gap: 16px;
  }
  .eyebrow {
    font-weight: 700; font-size: 28px; letter-spacing: 0.26em;
    text-transform: uppercase; color: var(--primary);
  }
  .h1 {
    font-weight: 900; font-size: 150px; line-height: 0.9;
    letter-spacing: -0.045em; text-transform: uppercase;
    color: var(--dark);
  }
  .h1 .em { color: var(--primary); }
  .lede {
    font-weight: 700; font-size: 28px; line-height: 1.25;
    letter-spacing: 0.02em; color: var(--secondary);
    text-transform: uppercase;
  }
  .pill {
    display: inline-block; align-self: flex-start;
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 42px; line-height: 1;
    padding: 14px 24px;
    border: 5px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--dark);
    transform: rotate(-1.5deg);
    margin-top: 6px;
  }

  /* Product photo centered in lower half, below text, above disclaimer */
  .product-hero {
    position: absolute;
    left: 50%;
    bottom: 140px;
    transform: translateX(-50%) rotate(-3deg);
    width: 880px;
    height: auto;
    z-index: 2;
    filter: drop-shadow(14px 14px 0 rgba(26,26,26,0.35));
  }
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">01 / 04</div>
    </div>

    <div class="hero-text">
      <div class="eyebrow">Alien Puff · Rolling Papers</div>
      <div class="h1">15<br/><span class="em">sabores.</span></div>
      <div class="lede">3 familias · Un solo catálogo</div>
      <div class="pill">desde €2.50</div>
    </div>

    <img class="product-hero" src="../../../assets/products/papers-alien.webp" alt="Alien Puff packs">
  </div>
</body></html>

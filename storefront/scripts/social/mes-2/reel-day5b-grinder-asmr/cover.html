<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--dark); color: var(--cream);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      row-gap: 36px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--cream); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--orange); color: var(--cream);
      border: 4px solid var(--cream); box-shadow: 6px 6px 0 0 var(--orange);
    }

    .visual {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .grinder-photo {
      width: 720px; max-width: 90%;
      filter: drop-shadow(20px 20px 0 var(--orange));
      transform: rotate(-4deg);
      z-index: 2;
    }
    .grinder-photo img { width: 100%; height: auto; object-fit: contain; }
    .ripples { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 720px; height: 720px; border: 4px solid var(--cream); border-radius: 50%; opacity: 0.35; }
    .ripples.r2 { width: 880px; height: 880px; opacity: 0.18; }

    .title {
      text-align: center;
    }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.42em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 14px;
    }
    .h1 {
      font-weight: 900; font-size: 200px; line-height: 0.86;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 32px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--orange); font-weight: 900; text-transform: uppercase; }
    .cta .tagline { font-style: italic; font-size: 24px; color: rgba(245,242,232,0.5); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="visual">
      <div class="ripples r2"></div>
      <div class="ripples"></div>
      <div class="grinder-photo"><img src="../../assets/products/grinder-basic.webp" alt="Grinder"/></div>
    </div>

    <div class="title">
      <div class="eyebrow">ASMR · Sound on</div>
      <div class="h1">El arte<br/><span class="em">de armar.</span></div>
    </div>

    <div class="cta">
      <div class="label">Grinders en <span class="em">enrola.shop</span></div>
      <div class="tagline">Sube el volumen.</div>
    </div>
  </div>
</body>
</html>

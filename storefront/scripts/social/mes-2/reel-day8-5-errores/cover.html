<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--dark); color: var(--cream);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .reel {
      width: 1080px; height: 1920px;
      padding: 240px 80px 440px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 32px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--cream); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--orange); color: var(--cream);
      border: 4px solid var(--cream); box-shadow: 6px 6px 0 0 var(--orange);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 14px;
    }
    .h1 {
      font-weight: 900; font-size: 200px; line-height: 0.86;
      letter-spacing: -0.06em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }
    .h1 .x { color: var(--orange); font-size: 200px; }

    .errors {
      display: flex; flex-direction: column; justify-content: center;
      gap: 16px;
    }
    .err {
      display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px;
      padding: 22px 26px;
      background: rgba(255,255,255,0.06);
      border: 4px solid var(--cream);
      box-shadow: 8px 8px 0 0 var(--orange);
    }
    .err-num {
      width: 64px; height: 64px;
      background: var(--orange); color: var(--cream);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 38px; line-height: 1;
    }
    .err-text { font-weight: 700; font-size: 32px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.05; }
    .err-tag {
      font-weight: 900; font-size: 22px; letter-spacing: 0.16em;
      padding: 10px 18px; text-transform: uppercase;
      background: var(--orange); color: var(--cream); border: 3px solid var(--cream);
    }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--orange); font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="reel">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Por esto se desarma</div>
      <div class="h1">5<br/><span class="em">errores.</span></div>
    </div>

    <div class="errors">
      <div class="err"><div class="err-num">1</div><div class="err-text">Papel muy lleno</div><div class="err-tag">Mal</div></div>
      <div class="err"><div class="err-num">2</div><div class="err-text">Filtro al revés</div><div class="err-tag">Mal</div></div>
      <div class="err"><div class="err-num">3</div><div class="err-text">Sello flojo</div><div class="err-tag">Mal</div></div>
      <div class="err"><div class="err-num">4</div><div class="err-text">Papel arrugado</div><div class="err-tag">Mal</div></div>
      <div class="err"><div class="err-num">5</div><div class="err-text">Tabaco mojado</div><div class="err-tag">Mal</div></div>
    </div>

    <div class="cta">
      <div class="label">Conos pre-armados · <span class="em">cero errores</span> · 12 uds</div>
    </div>
  </div>
</body>
</html>

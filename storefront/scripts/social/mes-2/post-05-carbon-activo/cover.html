<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/shared.css">
<style>
  html, body { height: 1920px; }
  .frame { background: var(--cream); height: 1920px; }

  /* IG Reel safe zones: top 240 (below username bar), key content in the
     1:1 grid visible band y=420-1500, bottom 440 clear of reply bar. */
  .cover-top {
    position: absolute; top: 240px; left: 64px; right: 64px;
    display: flex; justify-content: space-between; align-items: center; z-index: 3;
  }
  .cover-brand {
    font-weight: 900; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--dark); display: flex; align-items: center; gap: 14px;
  }
  .cover-brand .dot { width: 14px; height: 14px; background: var(--primary); border: 3px solid currentColor; }
  .cover-badge {
    font-weight: 900; font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 18px; background: var(--primary); color: var(--cream);
    border: 3px solid var(--dark); box-shadow: 5px 5px 0 0 var(--dark);
  }

  .cover-hero {
    /* Starts inside the 1:1 grid visible band (y>=420) so the title is
       prominent in both the reels grid and when the reel is paused. */
    position: absolute; left: 64px; right: 64px; top: 460px; z-index: 2;
    display: flex; flex-direction: column; gap: 32px;
  }
  .eyebrow {
    font-weight: 700; font-size: 36px; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--primary);
  }
  .cover-h1 {
    font-weight: 900; font-size: 200px; line-height: 0.85;
    letter-spacing: -0.05em; text-transform: uppercase; color: var(--dark);
  }
  .cover-h1 .em { color: var(--primary); }
  .cover-sub {
    font-weight: 700; font-size: 38px; line-height: 1.25;
    letter-spacing: 0.02em; color: var(--secondary); text-transform: uppercase;
  }

  .product-stage {
    /* Sits inside the 1:1 grid visible band, above the bottom safe zone. */
    position: absolute; left: 50%; bottom: 520px;
    transform: translateX(-50%);
    width: 580px; height: 620px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .product-stage img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transform: rotate(-4deg);
    filter: drop-shadow(16px 16px 0 rgba(26,26,26,0.3));
  }
  .price-pill {
    position: absolute; right: 80px; bottom: 560px; z-index: 3;
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 58px; line-height: 1;
    padding: 22px 36px; border: 6px solid var(--dark);
    box-shadow: 14px 14px 0 0 var(--dark);
    transform: rotate(4deg); letter-spacing: -0.02em;
  }
</style></head>
<body>
  <div class="frame reel">
    <div class="cover-top">
      <div class="cover-brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="cover-badge">Reel · 05</div>
    </div>

    <div class="cover-hero">
      <div class="eyebrow">Filtros · Alien Puff</div>
      <div class="cover-h1">Carbón<br/><span class="em">activo.</span></div>
      <div class="cover-sub">¿Por qué importa?</div>
    </div>

    <div class="product-stage">
      <img src="../../assets/products/filtros-carbon.webp" alt="Filtros carbón">
    </div>
    <div class="price-pill">€7 · 10 UDS</div>
  </div>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .frame { background: var(--cream); }
  .hero-text {
    position: absolute; left: 64px; right: 64px; top: 140px;
    z-index: 3;
    display: flex; flex-direction: column; gap: 12px;
  }
  .flower-emoji {
    font-size: 200px; line-height: 1; margin-bottom: 4px;
  }
  .eyebrow {
    font-weight: 700; font-size: 26px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--primary);
  }
  .flor-h1 {
    font-weight: 900; font-size: 150px; line-height: 0.88;
    letter-spacing: -0.04em; text-transform: uppercase;
    color: var(--dark);
  }
  .scientific {
    font-weight: 500; font-size: 22px; letter-spacing: 0.04em;
    color: var(--secondary); font-style: italic;
  }

  /* Product card — centered between hero and benefits */
  .product-card {
    position: absolute; left: 50%;
    top: 600px;
    transform: translateX(-50%);
    z-index: 2;
    width: 500px; height: 460px;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    border: 5px solid var(--dark);
    box-shadow: 12px 12px 0 0 var(--orange);
    padding: 24px;
  }
  .product-card img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    transform: rotate(-2deg);
    filter: drop-shadow(8px 8px 0 rgba(26,26,26,0.28));
  }
  .product-card .tag {
    position: absolute; bottom: -24px; right: -24px;
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 28px; line-height: 1;
    padding: 12px 18px; border: 4px solid var(--dark);
    box-shadow: 6px 6px 0 0 var(--dark);
    letter-spacing: -0.01em; transform: rotate(4deg);
  }

  .benefits-box {
    position: absolute; left: 64px; right: 64px; bottom: 100px;
    z-index: 3;
    padding: 22px 26px;
    background: var(--dark); color: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--orange);
  }
  .benefits-label {
    font-weight: 900; font-size: 13px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--orange);
    margin-bottom: 6px;
  }
  .benefits-text {
    font-weight: 700; font-size: 20px; letter-spacing: 0.03em;
    line-height: 1.35; text-transform: uppercase;
  }
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">02 / 04</div>
    </div>

    <div class="hero-text">
      <div class="flower-emoji">🌼</div>
      <div class="eyebrow">Flor 02</div>
      <div class="flor-h1">Manzanilla.</div>
      <div class="scientific">Matricaria recutita</div>
    </div>

    <div class="product-card">
      <img src="../../../assets/products/papers-marron.webp" alt="Papers Marrón Enrola">
      <div class="tag">€2.50</div>
    </div>

    <div class="benefits-box">
      <div class="benefits-label">Beneficios</div>
      <div class="benefits-text">Calma el sistema nervioso · Reduce ansiedad · Ideal para la tarde</div>
    </div>
  </div>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .frame { background: var(--cream); }
  .hero-text {
    position: absolute; left: 64px; right: 64px; top: 140px;
    z-index: 3;
    display: flex; flex-direction: column; gap: 12px;
  }
  .flower-emoji {
    font-size: 200px; line-height: 1; margin-bottom: 4px;
  }
  .eyebrow {
    font-weight: 700; font-size: 26px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--primary);
  }
  .flor-h1 {
    font-weight: 900; font-size: 150px; line-height: 0.88;
    letter-spacing: -0.04em; text-transform: uppercase;
    color: var(--dark);
  }
  .scientific {
    font-weight: 500; font-size: 22px; letter-spacing: 0.04em;
    color: var(--secondary); font-style: italic;
  }

  .cta-card {
    position: absolute; left: 64px; right: 64px;
    top: 600px;
    z-index: 2;
    padding: 48px 40px;
    background: var(--cream);
    border: 5px solid var(--dark);
    box-shadow: 12px 12px 0 0 var(--orange);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .cta-big {
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 54px; line-height: 1;
    padding: 18px 34px; border: 5px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--dark);
    transform: rotate(-2deg); letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  .cta-sub {
    font-weight: 700; font-size: 22px; line-height: 1.3;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--secondary); text-align: center;
    margin-top: 6px;
  }

  .benefits-box {
    position: absolute; left: 64px; right: 64px; bottom: 100px;
    z-index: 3;
    padding: 22px 26px;
    background: var(--dark); color: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 10px 10px 0 0 var(--orange);
  }
  .benefits-label {
    font-weight: 900; font-size: 13px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--orange);
    margin-bottom: 6px;
  }
  .benefits-text {
    font-weight: 700; font-size: 20px; letter-spacing: 0.03em;
    line-height: 1.35; text-transform: uppercase;
  }
</style></head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 / 04</div>
    </div>

    <div class="hero-text">
      <div class="flower-emoji">🌸</div>
      <div class="eyebrow">Flor 04</div>
      <div class="flor-h1">Jazmín.</div>
      <div class="scientific">Jasminum officinale</div>
    </div>

    <div class="cta-card">
      <div class="cta-big">enrola.shop</div>
      <div class="cta-sub">Papers · Conos · Filtros<br/>para todo lo legal</div>
    </div>

    <div class="benefits-box">
      <div class="benefits-label">Beneficios</div>
      <div class="benefits-text">Ritual nocturno · Aromaterapia natural · Meditación</div>
    </div>
  </div>
</body></html>

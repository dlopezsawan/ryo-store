    header h1 { font-weight: 900; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }

    .header-right { display: flex; gap: 12px; align-items: center; font-size: 13px; }
    .stat {

    .stat .n { color: var(--orange); font-weight: 900; }
    button.btn {
      background: var(--orange); color: var(--cream);

      padding: 10px 20px; cursor: pointer;
      letter-spacing: 0.12em; text-transform: uppercase;
      transition: transform 0.1s;
    }
    button.btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 0 var(--cream); }
    button.btn.small { padding: 6px 14px; font-size: 12px; }
    button.btn.ghost { background: transparent; border-color: var(--cream); }
    button.btn.danger { background: var(--primary); }

    nav.jump {
      padding: 14px 28px; background: var(--cream);
      border-bottom: 2px solid var(--dark);
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    nav.jump a {
      font-weight: 700; font-size: 13px;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--dark); text-decoration: none;
      padding: 8px 14px; border: 2px solid var(--dark);
      box-shadow: 3px 3px 0 0 var(--dark); background: white;
    }
    nav.jump a:hover { background: var(--orange); color: var(--cream); }

    main { padding: 32px 28px 80px; max-width: 1400px; margin: 0 auto; }
    section { margin-bottom: 60px; }
    h2 {
      font-weight: 900; font-size: 42px; line-height: 1;

      margin-bottom: 28px;
    }
    h2 .em { color: var(--primary); }
    h2 .count { color: var(--muted); font-weight: 600; font-size: 20px; margin-left: 12px; letter-spacing: 0.1em; }

    /* Post cards */
    .posts-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 24px;
    }
    .card {
      background: white; border: 4px solid var(--dark);
      box-shadow: 8px 8px 0 0 var(--dark);
      display: flex; flex-direction: column;
      transition: transform 0.15s;
    }
    .card.done { box-shadow: 8px 8px 0 0 var(--secondary); }
    .card.done::before {
      content: "✓ Revisado";
      position: absolute; top: 10px; right: 10px;
      background: var(--secondary); color: var(--cream);
      padding: 4px 10px; font-weight: 700; font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase; z-index: 10;
    }
    .card { position: relative; }
    .card-header {
      padding: 14px 18px;
      border-bottom: 3px solid var(--dark);
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px;
    }
    .card-title {
      font-weight: 900; font-size: 18px; line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .card-meta {
      font-weight: 600; font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      margin-top: 4px;
    }
    .pill {
      display: inline-block; padding: 3px 10px;
      font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
      border: 2px solid var(--dark); background: var(--orange); color: var(--cream);
      flex-shrink: 0;
    }
    .pill.reel { background: var(--primary); }
    .pill.carrusel { background: var(--secondary); color: var(--cream); }
    .pill.single { background: var(--dark); color: var(--cream); }

    .media {
      background: var(--dark);
      display: flex; align-items: center; justify-content: center;
      min-height: 320px; position: relative;
      overflow: hidden;
    }
    .media video, .media img {
      max-width: 100%; max-height: 480px;
      display: block; object-fit: contain;
    }
    .carousel-wrap {
      position: relative;
      background: var(--dark);
    }
    .media.carousel {
      display: block;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      background: var(--dark);
      scrollbar-width: none;
      min-height: auto;
    }
    .media.carousel::-webkit-scrollbar { display: none; }
    .media.carousel img {
      display: inline-block;
      vertical-align: top;
      /* width is set via JS to scroller.clientWidth */
      height: 560px;
      object-fit: contain;
      scroll-snap-align: start;
      background: var(--cream);
    }

      background: var(--dark);
      padding: 0;
      border-bottom: 2px solid var(--cream);

      background: var(--orange); color: var(--cream);
      font-weight: 900; font-size: 10px; letter-spacing: 0.24em;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-block;
      border-bottom: 2px solid var(--dark);
      border-right: 2px solid var(--dark);

    .reel-cover-wrap img {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      display: block;
      background: var(--cream);
    }

      padding: 10px 14px;
      background: var(--dark); color: var(--cream);
      border-top: 2px solid var(--cream);

      width: 40px; height: 40px;
      font-family: inherit; font-weight: 900; font-size: 20px; line-height: 1;
      cursor: pointer; padding: 0;
      transition: all 0.1s;

      background: var(--orange); border-color: var(--orange);

    .carousel-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
    .carousel-nav .counter {

    }
    .carousel-nav .counter .current { color: var(--orange); }

      width: 100%; aspect-ratio: 9/16; object-fit: cover;
      background: var(--dark);

      padding: 8px 10px; border-top: 2px solid var(--dark);
      font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;

    .story-meta .date { color: var(--muted); }
    .story-meta .type { color: var(--primary); font-weight: 900; }

      width: 100%; min-height: 60px; resize: vertical;
      border: none; border-top: 2px solid var(--dark);
      padding: 8px 10px; font-family: inherit; font-size: 12px;
      background: white; color: var(--dark);
    }
    .story-card textarea:focus { outline: 2px solid var(--orange); outline-offset: -2px; }

      position: fixed; bottom: 24px; right: 24px;
      background: var(--secondary); color: var(--cream);
      padding: 14px 20px; font-weight: 700; font-size: 13px;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: 3px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      transform: translateY(8px); pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Empty state */
    .empty {
      padding: 40px; text-align: center; color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 700px) {
      h2 { font-size: 30px; }

</head>

<script>
// Storage
const STORAGE_KEY = "enrola-feedback-mes2";

function loadFeedback() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveFeedback(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function getItem(id) {
  const s = loadFeedback();
  return s[id] || { text: "", reviewed_at: null };
}
function setItem(id, text, reviewed = null) {
  const s = loadFeedback();
  s[id] = {
    text,
    reviewed_at: reviewed !== null ? reviewed : (s[id]?.reviewed_at ?? null),
    updated_at: new Date().toISOString(),
  };
  saveFeedback(s);
  updateStats();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function updateStats() {
  const s = loadFeedback();
  const postCount = DATA.posts.filter(p => (s[p.id]?.text || "").trim()).length;
  const storyCount = DATA.stories.filter(st => (s[st.id]?.text || "").trim()).length;
  document.getElementById("statPosts").textContent = postCount;
  document.getElementById("statPostsTotal").textContent = DATA.posts.length;
  document.getElementById("statStories").textContent = storyCount;
  document.getElementById("statStoriesTotal").textContent = DATA.stories.length;
  document.getElementById("postsCount").textContent = `(${DATA.posts.length})`;
  document.getElementById("storiesCount").textContent = `(${DATA.stories.length})`;
}

// ==== Render POSTS ====
function renderPost(post) {
  const state = getItem(post.id);
  const hasFeedback = (state.text || "").trim().length > 0;

  // Detect video whether the src is a file path (.mp4) or a data URI (data:video/*)
  const isVideo = (src) => src.endsWith(".mp4") || src.startsWith("data:video/");
  let mediaHTML;
  if (post.previews.length === 1 && isVideo(post.previews[0])) {
    // Reel: show cover PNG first, then video below
    const coverPart = post.cover
      ? `<div class="reel-cover-wrap"><div class="reel-cover-label">Portada (1er frame)</div><img src="${post.cover}" loading="lazy"></div>`
      : "";
    mediaHTML = `${coverPart}<div class="media"><video src="${post.previews[0]}" ${post.cover ? `poster="${post.cover}"` : ""} controls preload="metadata" playsinline></video></div>`;
  } else if (post.previews.length === 1) {
    mediaHTML = `<div class="media"><img src="${post.previews[0]}" loading="lazy"></div>`;
  } else {
    // carousel — horizontal snap scroll with nav (JS-sized widths)
    const slides = post.previews.map((p, i) =>
      `<img src="${p}" loading="lazy" data-slide="${i}" alt="slide ${i+1}">`
    ).join("");
    const dots = post.previews.map((_, i) =>
      `<button class="dot${i === 0 ? " active" : ""}" data-goto="${i}" aria-label="Slide ${i+1}"></button>`
    ).join("");
    mediaHTML = `
      <div class="carousel-wrap" data-carousel>
        <div class="media carousel">${slides}</div>
        <div class="carousel-nav">
          <button data-prev aria-label="Anterior" disabled>←</button>
          <div class="carousel-dots">${dots}</div>
          <span class="counter"><span class="current">1</span> / ${post.previews.length}</span>
          <button data-next aria-label="Siguiente"${post.previews.length <= 1 ? ' disabled' : ''}>→</button>
        </div>
      </div>
    `;
  }

  const card = document.createElement("div");
  card.className = "card" + (hasFeedback ? " done" : "");
  card.dataset.id = post.id;
  card.innerHTML = `
    <div class="card-header">
      <div>
        <div class="card-title">#${post.number} · ${escapeHtml(post.title.replace(/^Post \d+ · /, ""))}</div>
        <div class="card-meta">${escapeHtml(post.date)} · ${escapeHtml(post.pillar)}</div>
      </div>
      <span class="pill ${post.format.toLowerCase()}">${escapeHtml(post.format)}</span>
    </div>
    ${mediaHTML}
    ${post.copy ? `
      <div class="copy-block">
        <div class="copy-label">Caption IG</div>
        ${escapeHtml(post.copy)}
      </div>
    ` : ""}
    <div class="feedback">
      <label>Feedback / cambios a ejecutar</label>
      <textarea placeholder="Escribe aquí lo que quieras cambiar…">${escapeHtml(state.text || "")}</textarea>
      <div class="feedback-actions">
        <span class="save-indicator ${hasFeedback ? "saved" : ""}">${hasFeedback ? "✓ guardado" : "sin feedback"}</span>
        <button class="btn small ghost" style="color:var(--dark); border-color:var(--dark); background:transparent;" data-clear>Borrar</button>
      </div>
    </div>
  `;
  const textarea = card.querySelector("textarea");
  const indicator = card.querySelector(".save-indicator");
  textarea.addEventListener("input", () => {
    setItem(post.id, textarea.value);
    card.classList.toggle("done", textarea.value.trim().length > 0);
    indicator.textContent = textarea.value.trim() ? "✓ guardado" : "sin feedback";
    indicator.classList.toggle("saved", textarea.value.trim().length > 0);
  });
  card.querySelector("[data-clear]").addEventListener("click", () => {
    textarea.value = "";
    setItem(post.id, "");
    card.classList.remove("done");
    indicator.textContent = "sin feedback";
    indicator.classList.remove("saved");
  });

  // Carousel nav — only if this post has one
  const carouselWrap = card.querySelector("[data-carousel]");
  if (carouselWrap) {
    const scroller = carouselWrap.querySelector(".media.carousel");
    const imgs = scroller.querySelectorAll("img");
    const prevBtn = carouselWrap.querySelector("[data-prev]");
    const nextBtn = carouselWrap.querySelector("[data-next]");
    const counter = carouselWrap.querySelector(".counter .current");
    const dots = carouselWrap.querySelectorAll(".dot");
    const total = dots.length;
    let currentIdx = 0;

    // Set each image's width to the scroller's clientWidth (bulletproof sizing)
    function sizeSlides() {
      const w = scroller.clientWidth;
      if (!w) return;
      imgs.forEach(img => { img.style.width = w + "px"; });
      // Snap back to currentIdx in new sizing
      scroller.scrollLeft = currentIdx * w;
    }

    function updateActive() {
      const w = scroller.clientWidth;
      if (!w) return;
      const idx = Math.round(scroller.scrollLeft / w);
      if (idx === currentIdx) return;
      currentIdx = idx;
      counter.textContent = idx + 1;
      dots.forEach((d, i) => d.classList.toggle("active", i === idx));
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;
    }

    function scrollTo(idx) {
      currentIdx = idx;
      scroller.scrollTo({ left: idx * scroller.clientWidth, behavior: "smooth" });
      counter.textContent = idx + 1;
      dots.forEach((d, i) => d.classList.toggle("active", i === idx));
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= total - 1;
    }

    prevBtn.addEventListener("click", () => scrollTo(Math.max(0, currentIdx - 1)));
    nextBtn.addEventListener("click", () => scrollTo(Math.min(total - 1, currentIdx + 1)));
    dots.forEach((d, i) => d.addEventListener("click", () => scrollTo(i)));
    scroller.addEventListener("scroll", () => window.requestAnimationFrame(updateActive));

    // Size now + on resize + after images load (in case layout changes)
    sizeSlides();
    const ro = new ResizeObserver(sizeSlides);
    ro.observe(scroller);
    imgs.forEach(img => img.addEventListener("load", sizeSlides, { once: true }));
  }

  return card;
}

function renderPosts() {
  const grid = document.getElementById("postsGrid");
  grid.innerHTML = "";
  DATA.posts.forEach(post => grid.appendChild(renderPost(post)));
}

// ==== Render STORIES ====
function getWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const start = new Date(d);
  start.setDate(d.getDate() - d.getDay() + 1); // Monday start
  const e = new Date(start); e.setDate(start.getDate() + 6);
  const fmt = (x) => x.toISOString().slice(0, 10);
  return `${fmt(start)}—${fmt(e)}`;
}

function weekLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const start = new Date(d); start.setDate(d.getDate() - d.getDay() + 1);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `Semana ${start.getDate()} ${MONTHS[start.getMonth()]} — ${end.getDate()} ${MONTHS[end.getMonth()]}`;
}

function prettyDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const DAYS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}

function renderStoryCard(st) {
  const state = getItem(st.id);
  const hasFeedback = (state.text || "").trim().length > 0;
  const card = document.createElement("div");
  card.className = "story-card" + (hasFeedback ? " done" : "");
  card.innerHTML = `
    <img src="${st.preview}" loading="lazy" alt="story">
    <div class="story-meta">
      <span class="date">${prettyDate(st.date)}</span>
      <span class="type">${escapeHtml(st.type)} · slot ${st.slot}</span>
    </div>
    <textarea placeholder="Feedback…">${escapeHtml(state.text || "")}</textarea>
  `;
  const textarea = card.querySelector("textarea");
  textarea.addEventListener("input", () => {
    setItem(st.id, textarea.value);
    card.classList.toggle("done", textarea.value.trim().length > 0);
  });
  return card;
}

function renderStories() {
  const root = document.getElementById("storiesRoot");
  root.innerHTML = "";
  // group by week, then by day
  const weeks = {};
  DATA.stories.forEach(s => {
    const wk = getWeekKey(s.date);
    (weeks[wk] = weeks[wk] || []).push(s);
  });
  Object.keys(weeks).sort().forEach(wkKey => {
    const first = weeks[wkKey][0];
    const block = document.createElement("div");
    block.className = "week-block";
    const count = weeks[wkKey].length;
    block.innerHTML = `<div class="week-header"><span>${weekLabel(first.date)} <span style="opacity:0.6; font-weight:600; margin-left:10px;">${count} stories</span></span><span class="chev">▼</span></div>`;
    // group by day
    const days = {};
    weeks[wkKey].forEach(s => (days[s.date] = days[s.date] || []).push(s));
    Object.keys(days).sort().forEach(date => {
      const dg = document.createElement("div");
      dg.className = "day-group";
      days[date].sort((a, b) => a.slot - b.slot).forEach(s => dg.appendChild(renderStoryCard(s)));
      block.appendChild(dg);
    });
    block.querySelector(".week-header").addEventListener("click", () => block.classList.toggle("collapsed"));
    root.appendChild(block);
  });
}

// ==== Utility ====
function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// ==== Export + Clear ====
document.getElementById("exportBtn").addEventListener("click", () => {
  const feedback = loadFeedback();
  // Filter only items with actual feedback
  const items = {};
  for (const [id, val] of Object.entries(feedback)) {
    if ((val.text || "").trim()) items[id] = val;
  }
  const out = {
    project: "enrola-mes-2",
    exported_at: new Date().toISOString(),
    item_count: Object.keys(items).length,
    feedback: items,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const ts = new Date().toISOString().slice(0, 19).replace(/:/g, "-");
  a.download = `feedback-mes2-${ts}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`Exportados ${out.item_count} feedbacks`);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("¿Borrar TODO el feedback de este navegador? Esto no afecta los archivos del proyecto, solo tus notas aquí.")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderPosts();
  renderStories();
  updateStats();
  showToast("Feedback borrado");
});

// ==== Init ====
renderPosts();
renderStories();
updateStats();
</script>

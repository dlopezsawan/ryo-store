<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431; --cream: #F5F2E8; --dark: #1A1A1A; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: linear-gradient(180deg, var(--cream) 0%, #F0EAD6 100%);
      color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .story {
      width: 1080px; height: 1920px;
      padding: 220px 80px 320px 64px;
      display: grid;
      grid-template-rows: auto 1fr auto auto auto;
      row-gap: 48px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--primary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .pin-area { display: flex; align-items: center; justify-content: center; }
    .pin {
      width: 200px; height: 200px;
      background: var(--orange);
      border: 8px solid var(--dark);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 14px 14px 0 0 var(--dark);
      position: relative;
    }
    .pin::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: var(--cream); border-radius: 50%;
      border: 7px solid var(--dark);
    }

    .hero { text-align: center; }
    .eyebrow { font-weight: 700; font-size: 32px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--primary); margin-bottom: 16px; }
    .h1 { font-weight: 900; font-size: 168px; line-height: 0.86; letter-spacing: -0.04em; text-transform: uppercase; }
    .h1 .city { color: var(--orange); }

    .deal {
      width: 100%;
      background: var(--dark); color: var(--cream);
      padding: 44px 36px;
      border: 5px solid var(--dark);
      box-shadow: 14px 14px 0 0 var(--orange);
      text-align: center;
    }
    .deal-line-1 { font-weight: 900; font-size: 100px; line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase; }
    .deal-line-1 .em { color: var(--orange); }
    .deal-line-2 { font-weight: 700; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 18px; }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 34px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { font-weight: 900; color: var(--primary); text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="story">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="badge">Envío · Valencia</div>
    </div>
    <div class="pin-area"><div class="pin"></div></div>
    <div class="hero">
      <div class="eyebrow">Si vives acá ↓</div>
      <div class="h1"><span class="city">Valencia</span><br/>ojo.</div>
    </div>
    <div class="deal">
      <div class="deal-line-1">Envío<br/><span class="em">GRATIS</span></div>
      <div class="deal-line-2">Pedidos desde €10 · 9am – 9pm</div>
    </div>
    <div class="cta">
      <div class="label">Suma <span class="em">€10</span> y te llega mañana</div>
    </div>
  </div>
</body>
</html>

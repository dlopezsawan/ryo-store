<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #BB3B2E; --orange: #FF3B27; --secondary: #4D5431;
      --cream: #F5F2E8; --dark: #1A1A1A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body {
      font-family: 'Kanit', system-ui, sans-serif;
      background: var(--cream); color: var(--dark);
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }

    .story {
      width: 1080px; height: 1920px;
      padding: 220px 80px 320px 64px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      row-gap: 56px;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 900; font-size: 30px; letter-spacing: 0.28em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
    .brand .dot { width: 16px; height: 16px; background: var(--orange); border: 3px solid var(--dark); }
    .badge {
      font-weight: 900; font-size: 24px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 12px 22px;
      background: var(--secondary); color: var(--cream);
      border: 4px solid var(--dark); box-shadow: 6px 6px 0 0 var(--dark);
    }

    .hero { }
    .eyebrow {
      font-weight: 700; font-size: 32px; letter-spacing: 0.32em;
      text-transform: uppercase; color: var(--primary); margin-bottom: 20px;
    }
    .h1 {
      font-weight: 900; font-size: 156px; line-height: 0.86;
      letter-spacing: -0.04em; text-transform: uppercase;
    }
    .h1 .em { color: var(--orange); }

    .tiers {
      display: flex; flex-direction: column; justify-content: center;
      gap: 22px;
    }
    .tier {
      display: flex; align-items: center; justify-content: space-between;
      padding: 30px 40px;
      background: var(--cream);
      border: 5px solid var(--dark);
      box-shadow: 9px 9px 0 0 var(--dark);
    }
    .tier.t2 { background: #FFFAF0; }
    .tier.t3 { background: #FFEFD5; }
    .tier.t4 { background: var(--orange); color: var(--cream); border-color: var(--dark); }

    .tier-label {
      display: flex; align-items: center; gap: 24px;
    }
    .tier-num { font-weight: 900; font-size: 76px; line-height: 1; color: var(--primary); letter-spacing: -0.05em; }
    .tier.t4 .tier-num { color: var(--cream); }

    .tier-text { display: flex; flex-direction: column; }
    .tier-text .label-main { font-weight: 900; font-size: 44px; letter-spacing: -0.01em; line-height: 1; }
    .tier-text .label-sub {
      font-weight: 600; font-size: 22px; letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.55);
      margin-top: 6px;
    }
    .tier.t4 .label-sub { color: rgba(245, 242, 232, 0.85); font-weight: 700; }

    .tier-pct { font-weight: 900; font-size: 70px; letter-spacing: -0.04em; color: var(--orange); }
    .tier.t4 .tier-pct { color: var(--cream); }

    .cta { text-align: center; }
    .cta .label { font-weight: 700; font-size: 34px; letter-spacing: 0.04em; line-height: 1.2; }
    .cta .em { color: var(--primary); font-weight: 900; }
  </style>
</head>
<body>
  <div class="story">
    <div class="header">
      <div class="brand"><span class="dot"></span>Enrola · Shop</div>
      <div class="badge">Tip · 01</div>
    </div>

    <div class="hero">
      <div class="eyebrow">Sin código · auto-aplica</div>
      <div class="h1">Mientras<br/><span class="em">más, menos.</span></div>
    </div>

    <div class="tiers">
      <div class="tier t1">
        <div class="tier-label">
          <span class="tier-num">3+</span>
          <div class="tier-text">
            <span class="label-main">Combo</span>
            <span class="label-sub">Mezcla productos</span>
          </div>
        </div>
        <div class="tier-pct">10%</div>
      </div>
      <div class="tier t2">
        <div class="tier-label">
          <span class="tier-num">5+</span>
          <div class="tier-text">
            <span class="label-main">Combo</span>
            <span class="label-sub">Mezcla productos</span>
          </div>
        </div>
        <div class="tier-pct">15%</div>
      </div>
      <div class="tier t3">
        <div class="tier-label">
          <span class="tier-num">10+</span>
          <div class="tier-text">
            <span class="label-main">Combo</span>
            <span class="label-sub">Mezcla productos</span>
          </div>
        </div>
        <div class="tier-pct">20%</div>
      </div>
      <div class="tier t4">
        <div class="tier-label">
          <span class="tier-num">24</span>
          <div class="tier-text">
            <span class="label-main">Mayorista</span>
            <span class="label-sub">Del mismo producto</span>
          </div>
        </div>
        <div class="tier-pct">30%</div>
      </div>
    </div>

    <div class="cta">
      <div class="label">Combina en <span class="em">arma-tu-combo</span></div>
    </div>
  </div>
</body>
</html>

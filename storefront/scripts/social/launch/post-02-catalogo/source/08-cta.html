<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .cta-wrap {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
  }
  .cta-features { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .feat { display: flex; align-items: center; gap: 16px;
    font-weight: 700; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; }
  .feat .check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; background: var(--orange); color: var(--cream);
    border: 3px solid var(--cream); box-shadow: 4px 4px 0 0 var(--cream);
    font-weight: 900; font-size: 22px;
  }
</style>
</head>
<body>
  <div class="frame dark">
    <div class="top">
      <div class="brand" style="color: var(--cream);"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num" style="color: var(--cream);">08 / 08</div>
    </div>

    <div class="cta-wrap">
      <div class="cta-box" style="background: var(--cream); color: var(--dark); box-shadow: 14px 14px 0 0 var(--orange);">
        <div style="font-weight:600; font-size:22px; letter-spacing:0.18em; text-transform:uppercase; color: var(--secondary);">
          Drop 001 · Lanzamiento 20-26 abr
        </div>
        <div class="big">20% OFF<br/><span class="em">ENROLA420</span></div>
        <div style="font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--secondary); margin-top: -6px;">
          Toda la semana de lanzamiento
        </div>
        <div class="cta-features" style="color: var(--dark);">
          <div class="feat"><span class="check" style="background: var(--primary); border-color: var(--dark); box-shadow: 4px 4px 0 0 var(--dark);">✓</span> Regístrate en enrola.shop</div>
          <div class="feat"><span class="check" style="background: var(--primary); border-color: var(--dark); box-shadow: 4px 4px 0 0 var(--dark);">✓</span> Solo en tu primera compra</div>
          <div class="feat"><span class="check" style="background: var(--primary); border-color: var(--dark); box-shadow: 4px 4px 0 0 var(--dark);">✓</span> Carrito mínimo 15 €</div>
          <div class="feat"><span class="check" style="background: var(--primary); border-color: var(--dark); box-shadow: 4px 4px 0 0 var(--dark);">✓</span> Solo Pago Móvil · MRW VE</div>
        </div>
      </div>
    </div>

    <div class="bottom" style="color: var(--cream);">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta"><span class="accent">Link en bio</span><br/>O DM nosotros</div>
    </div>
  </div>
</body></html>

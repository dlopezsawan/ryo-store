<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../../lib/shared.css">
<style>
  .frame.reel { background: var(--cream); }
  .center-stack {
    position: absolute; left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 60px;
    z-index: 2;
  }
  .tile {
    width: 520px; height: 520px;
    background: var(--cream);
    border: 8px solid var(--dark);
    box-shadow: 22px 22px 0 0 var(--orange);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 0;
    overflow: hidden;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    border: 4px solid var(--dark);
    font-family: 'Kanit', sans-serif;
    font-weight: 900; font-size: 130px; line-height: 1;
    letter-spacing: -0.04em;
  }
  .cell.papers   { background: var(--orange);    color: var(--cream); }
  .cell.conos    { background: var(--cream);     color: var(--dark); }
  .cell.grinders { background: var(--secondary); color: var(--cream); }
  .cell.filtros  { background: var(--dark);      color: var(--cream); }

  .label {
    font-weight: 900; font-size: 92px; letter-spacing: -0.02em;
    text-transform: uppercase; color: var(--dark); line-height: 1;
  }
  .brand-tag {
    position: absolute; left: 0; right: 0; top: 80px;
    text-align: center;
    font-weight: 900; font-size: 24px; letter-spacing: 0.32em;
    color: var(--secondary); text-transform: uppercase;
  }
  .brand-tag .dot { display: inline-block; width: 10px; height: 10px;
    background: var(--primary); border: 2px solid var(--dark);
    vertical-align: middle; margin: 0 14px 4px;
  }
</style></head>
<body>
  <div class="frame reel">
    <div class="brand-tag">Enrola<span class="dot"></span>Shop</div>
    <div class="center-stack">
      <div class="tile">
        <div class="cell papers">P</div>
        <div class="cell conos">C</div>
        <div class="cell grinders">G</div>
        <div class="cell filtros">F</div>
      </div>
    </div>
  </div>
</body></html>

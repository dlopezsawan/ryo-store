<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .reel .top { top: 80px; }
  .reel .bottom { bottom: 80px; }
  .reel .brand { font-size: 26px; }
  .reel .slide-num { font-size: 22px; padding: 10px 18px; }
  .reel .handle { font-size: 44px; }
  .reel .meta { font-size: 22px; }
  .center {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
    display: flex; flex-direction: column; gap: 28px; align-items: flex-start;
  }
  .label {
    font-weight: 700; font-size: 32px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--secondary);
  }
  .hint {
    font-weight: 700; font-size: 36px; letter-spacing: 0.04em;
    margin-top: 280px;
  }
  .hint .em { color: var(--primary); font-weight: 900; }
</style></head>
<body>
  <div class="frame reel">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 · 20 · 26</div>
    </div>
    <div class="center">
      <div class="label">Tu código:</div>
      <div class="hint">Aplícalo al pagar para tu <span class="em">20% OFF</span></div>
    </div>
    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Solo hoy<br/><span style="color:var(--primary); font-weight:900;">Hasta 11:59 PM</span></div>
    </div>
  </div>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .reel .top { top: 80px; }
  .reel .bottom { bottom: 80px; }
  .reel .brand { font-size: 26px; }
  .reel .slide-num { font-size: 22px; padding: 10px 18px; }
  .reel .handle { font-size: 44px; }
  .reel .meta { font-size: 22px; }

  .stack {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
    display: flex; flex-direction: column; gap: 32px;
  }
  .head {
    font-weight: 900; font-size: 124px; line-height: 0.92;
    letter-spacing: -0.03em; text-transform: uppercase;
  }
  .head .em { color: var(--primary); }
  .step {
    display: flex; align-items: center; gap: 28px;
    padding: 26px 32px;
    background: var(--cream);
    border: 4px solid var(--dark);
    box-shadow: 8px 8px 0 0 var(--dark);
    font-weight: 700; font-size: 38px; letter-spacing: 0.02em;
  }
  .step .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px;
    background: var(--primary); color: var(--cream);
    border: 4px solid var(--dark);
    font-weight: 900; font-size: 36px;
    flex-shrink: 0;
  }
  .step .em { color: var(--primary); font-weight: 900; }
</style>
</head>
<body>
  <div class="frame reel">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 · 20 · 26</div>
    </div>

    <div class="stack">
      <div class="head">Cómo<br/><span class="em">canjearlo.</span></div>
      <div class="step"><span class="num">1</span> Regístrate en <span class="em" style="margin-left:6px;">enrola.shop</span></div>
      <div class="step"><span class="num">2</span> Carrito mínimo <span class="em" style="margin-left:6px;">15 €</span></div>
      <div class="step"><span class="num">3</span> Aplica <span class="em" style="margin-left:6px;">ENROLA420</span></div>
    </div>

    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Solo en tu<br/><span style="color:var(--primary); font-weight:900;">primera compra</span></div>
    </div>
  </div>
</body></html>

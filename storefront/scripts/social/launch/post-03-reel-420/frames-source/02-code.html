<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .reel .top { top: 80px; }
  .reel .bottom { bottom: 80px; }
  .reel .brand { font-size: 26px; }
  .reel .slide-num { font-size: 22px; padding: 10px 18px; }
  .reel .handle { font-size: 44px; }
  .reel .meta { font-size: 22px; }

  .center {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
    display: flex; flex-direction: column; gap: 28px; align-items: flex-start;
  }
  .label {
    font-weight: 700; font-size: 32px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--secondary);
  }
  .code-box {
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 156px; line-height: 1;
    padding: 36px 48px;
    border: 8px solid var(--dark);
    box-shadow: 18px 18px 0 0 var(--dark);
    transform: rotate(-1.5deg);
    letter-spacing: -0.02em;
  }
  .arrow {
    font-weight: 900; font-size: 60px; color: var(--primary);
    transform: rotate(20deg);
  }
  .hint {
    font-weight: 700; font-size: 36px; letter-spacing: 0.04em;
    margin-top: 12px;
  }
  .hint .em { color: var(--primary); font-weight: 900; }
</style>
</head>
<body>
  <div class="frame reel">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 · 20 · 26</div>
    </div>

    <div class="center">
      <div class="label">Tu código:</div>
      <div class="code-box">ENROLA420</div>
      <div class="hint">Aplícalo al pagar para tu <span class="em">20% OFF</span></div>
      <div style="font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--secondary); margin-top: -8px;">
        1ra compra · Mín. 15 € · Regístrate
      </div>
    </div>

    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Toda la semana<br/><span style="color:var(--primary); font-weight:900;">20 — 26 abr</span></div>
    </div>
  </div>
</body></html>

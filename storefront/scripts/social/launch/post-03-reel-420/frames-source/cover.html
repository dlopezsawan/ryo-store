<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  /* Reel-specific tuning: critical content in upper-center area (so it survives the IG grid crop) */
  .reel .top { top: 240px; }
  .reel .hero {
    top: 38%; transform: translateY(-50%);
  }
  .reel .bottom { bottom: 80px; }
  .reel .h1 {
    font-weight: 900; font-size: 196px; line-height: 0.9;
    letter-spacing: -0.04em; text-transform: uppercase;
  }
  .reel .h1 .em { color: var(--primary); }
  .code-pill {
    display: inline-block;
    background: var(--orange);
    color: var(--cream);
    font-weight: 900; font-size: 96px; line-height: 1;
    padding: 22px 36px;
    border: 6px solid var(--dark);
    box-shadow: 14px 14px 0 0 var(--dark);
    transform: rotate(-1.5deg);
    margin-top: 28px;
    letter-spacing: -0.01em;
  }
  .reel .lede {
    font-weight: 700; font-size: 38px; line-height: 1.2;
    letter-spacing: 0.02em; text-transform: uppercase;
    margin-top: 28px;
  }
  .urgency {
    position: absolute; bottom: 240px; left: 64px; right: 64px;
    z-index: 2;
    text-align: center;
  }
  .urgency-pill {
    display: inline-block;
    background: var(--dark); color: var(--cream);
    font-weight: 900; font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase;
    padding: 18px 32px;
    border: 4px solid var(--dark);
    box-shadow: 8px 8px 0 0 var(--primary);
  }
  .reel .meta { font-size: 22px; }
  .reel .handle { font-size: 44px; }
  .reel .brand { font-size: 26px; }
  .reel .slide-num { font-size: 22px; padding: 10px 18px; }
</style>
</head>
<body>
  <div class="frame reel">

    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 · 20 · 26</div>
    </div>

    <div class="hero">
      <div class="product-num" style="font-size: 28px;">
        <span class="badge" style="font-size: 30px; padding: 8px 20px;">REGALO</span> de bienvenida
      </div>
      <div class="h1">
        20%<br/>
        <span class="em">OFF.</span>
      </div>
      <div class="lede">En tu primera compra · Toda la semana.</div>
      <div class="code-pill">ENROLA420</div>
    </div>

    <div class="urgency">
      <div class="urgency-pill">📆 20 — 26 ABR · MÍN. 15 €</div>
    </div>

    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Regístrate en <span style="color:var(--primary); font-weight:900;">enrola.shop</span><br/>Solo Pago Móvil · MRW VE</div>
    </div>

  </div>
</body></html>

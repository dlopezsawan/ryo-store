<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../lib/shared.css">
<style>
  .reel .top { top: 80px; }
  .reel .bottom { bottom: 80px; }
  .reel .brand { font-size: 26px; color: var(--cream); }
  .reel .slide-num { font-size: 22px; padding: 10px 18px; color: var(--cream); border-color: var(--cream); box-shadow: 4px 4px 0 0 var(--cream); }
  .reel .handle { font-size: 44px; color: var(--cream); }
  .reel .handle .at { color: var(--orange); }
  .reel .meta { font-size: 22px; color: var(--cream); }
  .reel .meta .accent { color: var(--orange); font-weight: 900; }

  .stack {
    position: absolute; left: 64px; right: 64px;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
    display: flex; flex-direction: column; gap: 24px; align-items: center;
    text-align: center;
  }
  .clock-spacer { height: 280px; } /* reserves space for the animated clock */
  .label {
    font-weight: 700; font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cream);
  }
  .head {
    font-weight: 900; font-size: 116px; line-height: 0.92;
    letter-spacing: -0.03em; text-transform: uppercase;
    color: var(--cream);
  }
  .head .em { color: var(--orange); }
  .ribbon {
    background: var(--orange); color: var(--cream);
    font-weight: 900; font-size: 44px; padding: 18px 36px;
    border: 5px solid var(--cream);
    box-shadow: 10px 10px 0 0 var(--cream);
    letter-spacing: 0.02em;
    margin-top: 20px;
  }
</style></head>
<body>
  <div class="frame reel dark">
    <div class="top">
      <div class="brand"><span class="dot"></span> Enrola Shop</div>
      <div class="slide-num">04 · 20 · 26</div>
    </div>
    <div class="stack">
      <div class="label">Última hora</div>
      <div class="clock-spacer"></div>
      <div class="head">Hasta las<br/><span class="em">11:59 PM.</span></div>
      <div class="ribbon">CÓDIGO ENROLA420</div>
    </div>
    <div class="bottom">
      <div class="handle"><span class="at">@</span>enrola.shop</div>
      <div class="meta">Link en bio<br/><span class="accent">No esperes mañana</span></div>
    </div>
  </div>
</body></html>

<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;900&display=swap');:root {
  --primary: #BB3B2E;
  --orange: #FF3B27;
  --secondary: #4D5431;
  --cream: #F5F2E8;
  --dark: #1A1A1A;
  --background-dark: #221610;
  --muted: #85827d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; min-height: 1350px; }
body {
  font-family: 'Kanit', system-ui, sans-serif;
  background: var(--cream);
  color: var(--dark);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.frame {
  width: 1080px;
  height: 1350px;
  position: relative;
  overflow: hidden;
  background: var(--cream);
}
.frame.reel { height: 1920px; } /* IG Reel/Story 9:16 */
.frame.transparent { background: transparent; }
.frame.transparent::before { display: none; }
body.transparent { background: transparent; }
.frame.dark { background: var(--background-dark); color: var(--cream); }

/* paper grain noise */
.frame::before {
  content: "";
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: 0.55;
  pointer-events: none;
  mix-blend-mode: multiply;
}
.frame.dark::before { mix-blend-mode: screen; opacity: 0.18; }

/* TOP BAR */
.top {
  position: absolute; top: 56px; left: 64px; right: 64px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 3;
}
.brand {
  display: flex; align-items: center; gap: 14px;
  font-weight: 900; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
}
.brand .dot { width: 14px; height: 14px; background: var(--primary); border: 3px solid currentColor; }
.slide-num {
  font-weight: 700; font-size: 18px; letter-spacing: 0.22em; text-transform: uppercase;
  padding: 8px 14px; border: 3px solid currentColor; background: transparent;
  box-shadow: 4px 4px 0 0 currentColor;
}

/* HERO container */
.hero {
  position: absolute; left: 64px; right: 64px;
  top: 50%; transform: translateY(-50%);
  z-index: 2;
  display: flex; flex-direction: column; gap: 20px;
}

/* numbered eyebrow (01/05 PRODUCTO) */
.product-num {
  display: inline-flex; align-items: center; gap: 18px;
  font-weight: 600; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--secondary);
}
.product-num .badge {
  display: inline-block;
  background: var(--primary); color: var(--cream);
  border: 3px solid var(--dark);
  box-shadow: 5px 5px 0 0 var(--dark);
  padding: 6px 16px; font-weight: 900; font-size: 26px; letter-spacing: 0.05em;
}
.dark .product-num { color: var(--orange); }
.dark .product-num .badge { border-color: var(--cream); box-shadow: 5px 5px 0 0 var(--cream); }

.h1 {
  font-weight: 900; font-size: 116px; line-height: 0.92;
  letter-spacing: -0.03em;
  text-transform: uppercase;
}
.h1.smaller { font-size: 96px; }
.h1 .em { color: var(--primary); }
.dark .h1 .em { color: var(--orange); }

.lede {
  font-weight: 500; font-size: 32px; line-height: 1.25;
  max-width: 820px;
  margin-top: 8px;
}
.dark .lede { color: var(--cream); }

/* visual block (right side icon) */
.visual {
  position: absolute; right: 64px; top: 50%; transform: translateY(-50%);
  width: 320px; height: 320px;
  z-index: 1; opacity: 0.95;
}

/* BOTTOM */
.bottom {
  position: absolute; left: 64px; right: 64px; bottom: 56px;
  z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 4px solid currentColor;
  padding-top: 22px;
}
.handle { font-weight: 900; font-size: 36px; letter-spacing: 0.02em; line-height: 1; }
.handle .at { color: var(--primary); }
.dark .handle .at { color: var(--orange); }
.meta {
  text-align: right;
  font-weight: 600; font-size: 18px; line-height: 1.3;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.meta .accent { color: var(--primary); font-weight: 900; }
.dark .meta .accent { color: var(--orange); }

/* Chips reusable */
.chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chip {
  font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 12px 20px;
  background: var(--cream); color: var(--dark);
  border: 3px solid var(--dark);
  box-shadow: 5px 5px 0 0 var(--dark);
}
.chip.alt { background: var(--dark); color: var(--cream); }
.dark .chip { background: transparent; color: var(--cream); border-color: var(--cream); box-shadow: 5px 5px 0 0 var(--cream); }
.dark .chip.alt { background: var(--orange); color: var(--cream); border-color: var(--cream); }

/* ========= Story (1080x1920) layout — used by highlight story content ========= */
.story-top {
  position: absolute; top: 90px; left: 64px; right: 64px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 3;
}
.story-brand {
  font-weight: 900; font-size: 22px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--secondary);
}
.story-num {
  font-weight: 700; font-size: 22px; letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 8px 16px; border: 3px solid var(--dark);
  box-shadow: 4px 4px 0 0 var(--dark); color: var(--dark);
}
.story-stack {
  position: absolute; left: 64px; right: 64px;
  top: 50%; transform: translateY(-50%);
  z-index: 2;
  display: flex; flex-direction: column; gap: 28px;
}
.story-eyebrow {
  font-weight: 700; font-size: 32px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--primary);
}
.story-h1 {
  font-weight: 900; font-size: 164px; line-height: 0.9;
  letter-spacing: -0.04em; text-transform: uppercase;
  color: var(--dark);
}
.story-h1.smaller { font-size: 128px; }
.story-h1.small { font-size: 104px; }
.story-h1 .em { color: var(--primary); }
.story-sub {
  font-weight: 600; font-size: 36px; line-height: 1.3;
  letter-spacing: 0.02em; color: var(--dark);
  max-width: 880px;
}
.story-list {
  display: flex; flex-direction: column; gap: 16px;
  margin-top: 8px;
}
.story-list-item {
  display: flex; align-items: center; gap: 18px;
  font-weight: 700; font-size: 34px; letter-spacing: 0.02em;
  padding: 18px 24px;
  background: var(--cream); border: 4px solid var(--dark);
  box-shadow: 7px 7px 0 0 var(--dark);
}
.story-list-item .dot {
  width: 18px; height: 18px; background: var(--orange); border: 3px solid var(--dark); flex-shrink: 0;
}
.story-list-item .price {
  margin-left: auto; font-weight: 900; color: var(--primary);
}
.story-pill {
  display: inline-block; align-self: flex-start;
  background: var(--orange); color: var(--cream);
  font-weight: 900; font-size: 56px; line-height: 1;
  padding: 18px 28px;
  border: 5px solid var(--dark);
  box-shadow: 10px 10px 0 0 var(--dark);
  letter-spacing: -0.01em; transform: rotate(-1.5deg);
}
.story-bottom {
  position: absolute; bottom: 90px; left: 64px; right: 64px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 3px solid var(--dark); padding-top: 20px;
  z-index: 2;
}
.story-handle { font-weight: 900; font-size: 36px; letter-spacing: 0.02em; }
.story-handle .at { color: var(--primary); }
.story-meta {
  text-align: right; font-weight: 600; font-size: 20px;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.story-meta .accent { color: var(--primary); font-weight: 900; }

/* CTA card (slide 7) */
.cta-box {
  border: 4px solid var(--dark);
  box-shadow: 14px 14px 0 0 var(--dark);
  background: var(--cream);
  padding: 56px 56px;
  display: flex; flex-direction: column; gap: 24px;
}
.cta-box .big {
  font-weight: 900; font-size: 84px; line-height: 0.95;
  letter-spacing: -0.02em; text-transform: uppercase; color: var(--dark);
}
.cta-box .big .em { color: var(--primary); }
</style>
<style>
  .frame.reel { background: var(--cream); }
  .center-stack {
    position: absolute; left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 60px;
    z-index: 2;
  }
  .tile {
    width: 520px; height: 520px;
    background: var(--cream);
    border: 8px solid var(--dark);
    box-shadow: 22px 22px 0 0 var(--orange);
    display: flex; align-items: center; justify-content: center;
  }
  .tile svg { width: 400px; height: 400px; }
  .label {
    font-weight: 900; font-size: 92px; letter-spacing: -0.02em;
    text-transform: uppercase; color: var(--dark); line-height: 1;
  }
  .brand-tag {
    position: absolute; left: 0; right: 0; top: 80px;
    text-align: center;
    font-weight: 900; font-size: 24px; letter-spacing: 0.32em;
    color: var(--secondary); text-transform: uppercase;
  }
  .brand-tag .dot { display: inline-block; width: 10px; height: 10px;
    background: var(--primary); border: 2px solid var(--dark);
    vertical-align: middle; margin: 0 14px 4px;
  }
</style></head>
<body>
  <div class="frame reel">
    <div class="brand-tag">Enrola<span class="dot"></span>Shop</div>
    <div class="center-stack">
      <div class="tile">
        <svg viewBox="0 0 220 200" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
          <!-- speed lines -->
          <line x1="4"  y1="90"  x2="26" y2="90"  stroke="#1A1A1A" stroke-width="7"/>
          <line x1="4"  y1="108" x2="32" y2="108" stroke="#1A1A1A" stroke-width="7"/>
          <line x1="4"  y1="126" x2="22" y2="126" stroke="#1A1A1A" stroke-width="7"/>

          <!-- delivery top-box on rear -->
          <rect x="20" y="58" width="64" height="54" fill="#F5F2E8" stroke="#1A1A1A" stroke-width="9"/>
          <line x1="20" y1="82" x2="84" y2="82" stroke="#1A1A1A" stroke-width="5"/>

          <!-- scooter body (red) -->
          <path d="M 42 112 L 108 112 L 150 112 L 168 138 L 48 138 Z" fill="#FF3B27" stroke="#1A1A1A" stroke-width="9" stroke-linejoin="round"/>

          <!-- seat -->
          <path d="M 92 112 L 140 112 L 144 102 L 96 102 Z" fill="#1A1A1A"/>

          <!-- handlebar riser + grips -->
          <path d="M 150 112 L 180 68" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round"/>
          <path d="M 170 64 L 200 64" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round"/>

          <!-- front headlight -->
          <circle cx="175" cy="98" r="11" fill="#FF3B27" stroke="#1A1A1A" stroke-width="6"/>

          <!-- ground line -->
          <line x1="30" y1="168" x2="200" y2="168" stroke="#1A1A1A" stroke-width="6" opacity="0.25"/>

          <!-- rear wheel -->
          <circle cx="66" cy="160" r="22" fill="#1A1A1A"/>
          <circle cx="66" cy="160" r="8"  fill="#F5F2E8" stroke="#1A1A1A" stroke-width="5"/>
          <!-- front wheel -->
          <circle cx="164" cy="160" r="22" fill="#1A1A1A"/>
          <circle cx="164" cy="160" r="8"  fill="#F5F2E8" stroke="#1A1A1A" stroke-width="5"/>
        </svg>
      </div>
    </div>
  </div>
</body></html>
